<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Embrulho · Tweet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=block" rel="stylesheet">
<link rel="stylesheet" href="../../_shared/embrulho.css">
<style>
.slot{left:80px;top:740px;width:920px;height:720px;border-radius:36px;box-shadow:0 0 0 4000px #1b1c1f}
.av{left:80px;top:440px;width:104px;height:104px}
.id{left:204px;top:440px;width:700px;height:52px;flex-direction:row;align-items:center;justify-content:flex-start;gap:10px;white-space:nowrap;color:#fff;font-weight:700;font-size:34px}
.id .nome{overflow:hidden;text-overflow:ellipsis}
.id .ar{color:#8b8f95;font-weight:400;font-size:28px}
.selo{flex:none}
.pts{left:920px;top:440px;width:80px;height:52px;color:#8b8f95;font-size:40px;align-items:flex-end;letter-spacing:2px}
.txt{left:204px;top:500px;width:796px;height:210px;color:#e9eaec;font-weight:400;line-height:1.25;justify-content:flex-start}
/* 4:5 (1080×1350) e 16:9 (1920×1080) */
html.p-4x5 .slot{left:80px;top:330px;width:920px;height:940px}html.p-4x5 .av{top:60px}html.p-4x5 .id{top:60px}html.p-4x5 .pts{top:60px}html.p-4x5 .txt{top:120px;height:190px}
html.p-16x9 .slot{left:1000px;top:80px;width:840px;height:920px}html.p-16x9 .av{left:100px;top:330px}html.p-16x9 .id{left:224px;top:330px;width:620px}html.p-16x9 .pts{left:860px;top:330px}html.p-16x9 .txt{left:224px;top:390px;width:716px;height:360px}
/* ?tema=claro */
html.tema-claro .slot{box-shadow:0 0 0 4000px #fff}html.tema-claro .id,html.tema-claro .txt{color:#0f1419}html.tema-claro .id .ar,html.tema-claro .pts{color:#536471}
</style>
</head>
<body>
<div class="slot"></div>
<img class="avatar av" src="../../_shared/avatar.svg" data-src="avatar" alt="">
<div class="t id"><span class="nome" data-c="perfil_nome"></span><svg class="selo" width="34" height="34" viewBox="0 0 24 24"><circle cx="12" cy="12" r="11" fill="#1d9bf0"/><path d="M7 12.5l3.2 3.2L17 8.8" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg><span class="ar" data-c="perfil_arroba" data-opt></span><span class="ar">· 10 min</span></div>
<div class="t pts">···</div>
<div class="t txt" data-c="texto" data-fit="40,26"></div>
<script src="../../_shared/embrulho.js"></script>
</body>
</html>
