    // Navigation events
    $('#btnBackToEsteira')?.addEventListener('click', () => {
      dashCurrentTab = 'esteira';
      renderView();
    });
    $('#btnCancelForm')?.addEventListener('click', () => {
      dashCurrentTab = 'esteira';
      renderView();
    });

    // Elements
    const filesListEl = $('#npFilesList');
    const multiBoxEl = $('#npMultiBox');
    const subtitleStripEl = $('#npSubtitleStrip');
    const dropzoneEl = $('#npDropzone');
    const fileInput = $('#npFileInput');
    const subFileInput = $('#npSubFileInput');
    const btnPickVideo = $('#btnPickVideo');
    const btnPickSubtitle = $('#btnPickSubtitle');
    const imgFileInput = $('#npImgFileInput');
    const btnPickImages = $('#btnPickImages');
    const statusDot = $('#npStatusIndicator');
    const statusText = $('#npStatusText');
    const statusSub = $('#npStatusSub');
    const nameInput = $('#npProjectName');
    const formatSelect = $('#npFormatSelect');
    const agentToggleBtn = $('#npAgentToggleBtn');
    const fmtPreview = $('#npFmtPreview');
    const refUrlInput = $('#npRefUrl');
    const preToggle = $('#npPreToggle');
    const btnCreate = $('#btnCreate');
    const uploadBox = $('#npUploadProgressBox');
    const uploadFileName = $('#npUploadFileName');
    const uploadPercent = $('#npUploadPercent');
    const uploadProgressBar = $('#npUploadProgressBar');

    let isAgentMode = false;
    let userManuallyToggledAgent = false;

    const setAgentToggle = (val) => {
      isAgentMode = !!val;
      if (agentToggleBtn) agentToggleBtn.classList.toggle('active', isAgentMode);
      updateFormatPreview();
      updateFooterStatus();
    };

    let brollFill = false;
    const brollBtn = $('#npBrollToggleBtn');
    if (brollBtn) brollBtn.onclick = () => { brollFill = !brollFill; brollBtn.classList.toggle('active', brollFill); };

    if (agentToggleBtn) {
      agentToggleBtn.onclick = () => {
        userManuallyToggledAgent = true;
        setAgentToggle(!isAgentMode);
      };
    }

    // Helper: format duration
    const formatDuration = sec => {
      if (!sec || isNaN(sec)) return '';
      const m = Math.floor(sec / 60);
      const s = Math.round(sec % 60);
      return m > 0 ? `${m}m ${s}s` : `${s}s`;
    };

    // Helper: update status footer
    const updateFooterStatus = () => {
      const chosenFmt = fl.find(f => f.id === formatSelect.value);
      const fmtLabel = chosenFmt?.name || formatSelect.value;
      const composerTag = isAgentMode ? ' · 🤖 Modo Agente' : ' · 🃏 Modo Cards';

      if (!videoPaths.length) {
        statusDot.className = 'np-status-indicator';
        statusText.textContent = 'Aguardando vídeo principal';
        statusSub.textContent = 'Envie ou escolha pelo menos um arquivo de gravação';
        btnCreate.style.opacity = '0.55';
      } else {
        statusDot.className = 'np-status-indicator ready';
        statusText.textContent = 'Pronto para iniciar a esteira';
        const vidCountText = videoPaths.length === 1 ? '1 vídeo selecionado' : `${videoPaths.length} vídeos (${multiMode === 'batch' ? 'em lote' : 'sequenciais'})`;
        const subText = subtitlePath ? ' · com legenda' : '';
        statusSub.textContent = `${vidCountText} · ${selectedBrand} · ${fmtLabel}${composerTag}${subText}`;
        btnCreate.style.opacity = '1';
      }
    };

    // Format Differences & Guidance Map
    const FORMAT_DIFFS = {
      'business-reels': {
        tag: '⚡ Ritmo ~2s',
        focus: 'Autoridade & Negócios',
        diferencial: 'Alternância entre 4 modos visuais: tela cheia no gancho/CTA, tela dividida para passos/listas e overlays compactos para dados e números sem cobrir o locutor.'
      },
      'motion-completo': {
        tag: '🎬 Motion Máximo',
        focus: 'Alta Retenção',
        diferencial: 'Motion design em densidade máxima: palavras gigantes atrás da cabeça do locutor recortado, cards dinâmicos, B-rolls e fundos animados a cada 1,5s.'
      },
      'personal-reels': {
        tag: '🎙️ Diário / Vlog',
        focus: 'Conexão Pessoal',
        diferencial: 'Cortes rápidos sem silêncios, alternando o locutor recortado com B-rolls do cotidiano (ou ilustrações de IA) e legendas de uma palavra em destaque.'
      },
      'cutout-backdrop': {
        tag: '🖼️ Cenário Imersivo',
        focus: 'Fundo 100% Cenário',
        diferencial: 'Locutor recortado em primeiro plano sobre cenários e imagens temáticas em tela cheia que se transformam dinamicamente a cada nova ideia falada.'
      },
      'explainer-panel': {
        tag: '📐 Split 60/40',
        focus: 'Aulas & Didática',
        diferencial: 'Painel dividido: 60% superiores para animações explicativas e esquemas conceituais, com o locutor em vídeo natural no painel arredondado na base (sem recorte).'
      },
      'split-reel': {
        tag: '⚖️ Split 50/50 • Onetake',
        focus: 'Diagramas Fluidos',
        diferencial: 'Divisão meio a meio: locutor fixo em cima e diagrama embaixo em estilo onetake (movimentos contínuos de pan, tilt e rotação sem cortes, revelando informações com cortes invisíveis).'
      },
      'ranking-format': {
        tag: '🏆 Tier List',
        focus: 'Classificações Interativas',
        diferencial: 'Tabela de classificação (S, A, B, C...) fixada na base enquanto você fala em tela cheia e preenche cada posição card por card durante a argumentação.'
      },
      'fitted-captions': {
        tag: '🔤 Tipografia Editorial',
        focus: 'Revista Cinética',
        diferencial: 'Foco total no poder do texto: uma palavra-chave gigante domina a tela com o resto da frase encaixado em volta, sem poluição de imagens extras.'
      },
      'image-cluster': {
        tag: '✨ Cluster Flutuante',
        focus: 'Conceitual & Imagens',
        diferencial: 'Locutor na base e um grupo orbital de 3 a 5 imagens geradas com leve rotação e sombra suave flutuando acima da cabeça com legendas discretas.'
      }
    };

    // Format Preview update (campo expandido explicativo)
    const updateFormatPreview = () => {
      const chosen = fl.find(f => f.id === formatSelect.value);
      if (chosen) {
        const diff = FORMAT_DIFFS[chosen.id] || {
          tag: chosen.aspectRatio || '9:16',
          focus: chosen.name || 'Padrão',
          diferencial: chosen.promptGuide
            ? (chosen.promptGuide.length > 210 ? chosen.promptGuide.slice(0, 207) + '...' : chosen.promptGuide)
            : (chosen.description || 'Formato otimizado para esta proporção com ritmo dinâmico e enquadramento inteligente.')
        };
        const cutoutBadge = chosen.cutout
          ? '<span class="np-fmt-badge np-fmt-cutout">✂ Recorte Alpha Ativo</span>'
          : '<span class="np-fmt-badge np-fmt-nocutout">👤 Vídeo Direto (Sem Recorte)</span>';
        const layoutBadge = chosen.layout ? `<span class="np-fmt-badge">📐 ${esc(chosen.layout)}</span>` : '';
        const composerBadge = isAgentMode
          ? '<span class="np-fmt-badge" style="background:rgba(168,85,247,0.22);color:#d8b4fe;border:1px solid rgba(168,85,247,0.45)">🤖 Agente Composer</span>'
          : '<span class="np-fmt-badge" style="background:rgba(59,130,246,0.15);color:#93c5fd;border:1px solid rgba(59,130,246,0.3)">🃏 Cards Tradicional</span>';

        fmtPreview.innerHTML = `
          <div class="np-fmt-top">
            <div class="np-fmt-badges">
              <span class="np-fmt-badge">${esc(chosen.aspectRatio || '9:16')}</span>
              ${layoutBadge}
              ${cutoutBadge}
              ${composerBadge}
            </div>
            <span class="np-fmt-pacing-pill">${esc(diff.tag)}</span>
          </div>
          ${chosen.description ? `<div class="np-fmt-desc">${esc(chosen.description)}</div>` : ''}
          <div class="np-fmt-guide-card">
            <span class="np-fmt-guide-title">💡 ${isAgentMode ? 'Modo Agente Ativo:' : 'Diferencial:'}</span>
            <span>${isAgentMode ? 'Liberdade criativa total orientada pelo Motion Guide (HyperFrames), sem restrições dos templates de cards pré-definidos.' : esc(diff.diferencial)}</span>
          </div>
        `;
      } else {
        fmtPreview.innerHTML = '';
      }
      updateFooterStatus();
    };
    if (formatSelect) {
      formatSelect.onchange = () => {
        const chosen = fl.find(f => f.id === formatSelect.value);
        if (!userManuallyToggledAgent && chosen) {
          isAgentMode = chosen.composer === 'agent';
          if (agentToggleBtn) agentToggleBtn.classList.toggle('active', isAgentMode);
        }
        updateFormatPreview();
      };
      // Alinhamento inicial com o primeiro formato
      const initChosen = fl.find(f => f.id === formatSelect.value);
      if (initChosen && initChosen.composer === 'agent') {
        isAgentMode = true;
        if (agentToggleBtn) agentToggleBtn.classList.add('active');
      }
      updateFormatPreview();
    }

    // Probe videos to get resolution and duration
    const probeAllVideos = async () => {
      if (!videoPaths.length) return;
      try {
        const m = await api('POST', '/probe', { paths: videoPaths });
        if (m) {
          videoProbes._combined = m;
          renderFilesList();
        }
      } catch (err) {
        console.warn('Probe error:', err);
      }
    };

    // Auto-fill project name from first video if empty
    const autoFillProjectName = () => {
      if (!nameInput.value.trim() && videoPaths.length > 0) {
        const first = videoPaths[0];
        const rawName = first.split('/').pop().replace(/\.[^/.]+$/, '');
        // Clean up common prefixes/suffixes
        const cleanName = rawName.replace(/[^a-zA-Z0-9_\-]/g, '-').replace(/-+/g, '-').toLowerCase();
        nameInput.value = cleanName || 'meu-video';
      }
    };

    // Render file cards list (Inspiration 2)
    const renderFilesList = () => {
      filesListEl.innerHTML = '';

      // Videos
      videoPaths.forEach((p, idx) => {
        const ext = p.split('.').pop().toUpperCase() || 'MP4';
        const fileName = p.split('/').pop();
        const probe = videoProbes._combined;
        let metaHtml = '';
        if (probe && videoPaths.length === 1) {
          metaHtml = `${probe.width}×${probe.height} · ${probe.fps} fps · ${formatDuration(probe.duration)}`;
        } else if (probe && videoPaths.length > 1) {
          metaHtml = `Vídeo ${idx + 1} de ${videoPaths.length} · Duração total combinada: ${formatDuration(probe.duration)}`;
        } else {
          metaHtml = `Vídeo local pronto para processamento`;
        }

        const card = document.createElement('div');
        card.className = 'np-file-card';
        card.innerHTML = `
          <div class="np-file-left">
            <div class="np-file-badge">${esc(ext)}</div>
            <div class="np-file-info">
              <div class="np-file-name" title="${esc(p)}">${esc(fileName)}</div>
              <div class="np-file-meta">
                <span>${metaHtml}</span>
              </div>
            </div>
          </div>
          <div class="np-file-actions">
            <button type="button" class="np-file-del-btn" data-del-vid="${idx}" title="Remover este vídeo">
              🗑️
            </button>
          </div>
        `;
        filesListEl.appendChild(card);
      });

      // Subtitle card (if selected)
      if (subtitlePath) {
        const subName = subtitlePath.split('/').pop();
        const subExt = subtitlePath.split('.').pop().toUpperCase() || 'SRT';
        const subCard = document.createElement('div');
        subCard.className = 'np-file-card';
        subCard.innerHTML = `
          <div class="np-file-left">
            <div class="np-file-badge subtitle">${esc(subExt)}</div>
            <div class="np-file-info">
              <div class="np-file-name" title="${esc(subtitlePath)}">${esc(subName)}</div>
              <div class="np-file-meta">
                <span>Legenda opcional carregada</span>
              </div>
            </div>
          </div>
          <div class="np-file-actions">
            <button type="button" class="np-file-del-btn" id="btnDelSub" title="Remover legenda">
              🗑️
            </button>
          </div>
        `;
        filesListEl.appendChild(subCard);
        subtitleStripEl.style.display = 'none';
      } else {
        subtitleStripEl.style.display = 'flex';
      }

      // Image card (if any images were sent)
      if (imagePaths.length) {
        const imgCard = document.createElement('div');
        imgCard.className = 'np-file-card';
        imgCard.innerHTML = `
          <div class="np-file-left">
            <div class="np-file-badge subtitle">IMG</div>
            <div class="np-file-info">
              <div class="np-file-name" title="${esc(imagePaths.join('\n'))}">${imagePaths.length} ${imagePaths.length > 1 ? 'imagens' : 'imagem'}</div>
              <div class="np-file-meta">
                <span>${esc(imagePaths.map(p => p.split('/').pop()).join(', '))}</span>
              </div>
            </div>
          </div>
          <div class="np-file-actions">
            <button type="button" class="np-file-del-btn" id="btnDelImgs" title="Remover imagens">
              🗑️
            </button>
          </div>
        `;
        filesListEl.appendChild(imgCard);
      }

      // Handle delete events
      filesListEl.querySelectorAll('[data-del-vid]').forEach(btn => {
        btn.onclick = () => {
          const i = Number(btn.dataset.delVid);
          videoPaths.splice(i, 1);
          renderFilesList();
          probeAllVideos();
          updateFooterStatus();
        };
      });

      const delSubBtn = $('#btnDelSub');
      if (delSubBtn) {
        delSubBtn.onclick = () => {
          subtitlePath = '';
          renderFilesList();
          updateFooterStatus();
        };
      }

      const delImgsBtn = $('#btnDelImgs');
      if (delImgsBtn) {
        delImgsBtn.onclick = () => {
          imagePaths = [];
          renderFilesList();
        };
      }

      // Multi video box display
      if (videoPaths.length > 1) {
        multiBoxEl.removeAttribute('hidden');
      } else {
        multiBoxEl.setAttribute('hidden', '');
      }

      updateFooterStatus();
    };

    // Brand pills click handler
    $('#npBrandBar')?.querySelectorAll('[data-brand]').forEach(btn => {
      btn.onclick = () => {
        selectedBrand = btn.dataset.brand;
        $('#npBrandBar').querySelectorAll('.np-brand-pill').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        updateFooterStatus();
        window.loadNpCharacters?.();
      };
    });

    // Segmented pre-edited toggle
    preToggle?.querySelectorAll('.np-seg-btn').forEach(btn => {
      btn.onclick = () => {
        selectedPre = btn.dataset.val;
        preToggle.querySelectorAll('.np-seg-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
      };
    });

    // Multi-mode cards click handler
    const cardConcat = $('#cardModeConcat');
    const cardBatch = $('#cardModeBatch');
    const updateMultiMode = (mode) => {
      multiMode = mode;
      if (mode === 'concat') {
        cardConcat?.classList.add('active');
        cardBatch?.classList.remove('active');
        const r = cardConcat?.querySelector('input');
        if (r) r.checked = true;
      } else {
        cardBatch?.classList.add('active');
        cardConcat?.classList.remove('active');
        const r = cardBatch?.querySelector('input');
        if (r) r.checked = true;
      }
      updateFooterStatus();
    };
    if (cardConcat) cardConcat.onclick = () => updateMultiMode('concat');
    if (cardBatch) cardBatch.onclick = () => updateMultiMode('batch');

    // Upload files handler (streaming with progress)
    const uploadFiles = async (files, kind = 'video') => {
      if (!files || !files.length) return;
      uploadBox.removeAttribute('hidden');
      uploadProgressBar.style.width = '0%';
      uploadPercent.textContent = '0%';

      const uploadedPaths = [];
      for (let i = 0; i < files.length; i++) {
        const f = files[i];
        uploadFileName.textContent = `Enviando (${i + 1}/${files.length}): ${f.name}`;

        try {
          const res = await new Promise((resolve, reject) => {
            const x = new XMLHttpRequest();
            x.open('POST', `/upload?kind=${kind}&name=${encodeURIComponent(f.name)}`);
            x.upload.onprogress = p => {
              if (p.lengthComputable) {
                const totalPct = Math.round(((i + (p.loaded / p.total)) / files.length) * 100);
                uploadProgressBar.style.width = `${totalPct}%`;
                uploadPercent.textContent = `${totalPct}%`;
              }
            };
            x.onload = () => {
              if (x.status === 200) {
                try { resolve(JSON.parse(x.responseText)); } catch { reject(new Error('Resposta inválida do servidor')); }
              } else {
                reject(new Error(x.responseText || 'Falha no envio'));
              }
            };
            x.onerror = () => reject(new Error('Falha de conexão no envio'));
            x.send(f);
          });

          if (res.path) uploadedPaths.push(res.path);
        } catch (err) {
          alert(`Erro ao enviar arquivo ${f.name}: ${err.message}`);
        }
      }

      uploadBox.setAttribute('hidden', '');

      if (kind === 'video') {
        videoPaths = [...new Set([...videoPaths, ...uploadedPaths])];
        autoFillProjectName();
        renderFilesList();
        probeAllVideos();
      } else if (kind === 'media') {
        imagePaths = [...new Set([...imagePaths, ...uploadedPaths])];
        renderFilesList();
      } else {
        if (uploadedPaths.length) {
          subtitlePath = uploadedPaths[0];
          renderFilesList();
        }
      }
    };

    // Pick Video Handler (Try server native picker first, then fallback to input)
    const handlePickVideo = async () => {
      try {
        const r = await api('POST', '/pick-file', { kind: 'video' });
        const newPaths = r.paths && r.paths.length ? r.paths : (r.path ? [r.path] : []);
        if (newPaths.length) {
          videoPaths = [...new Set([...videoPaths, ...newPaths])];
          autoFillProjectName();
          renderFilesList();
          probeAllVideos();
        }
      } catch (err) {
        // Fallback to browser file input
        fileInput.click();
      }
    };

    btnPickVideo.onclick = (e) => {
      e.stopPropagation();
      handlePickVideo();
    };

    dropzoneEl.onclick = (e) => {
      if (e.target !== btnPickVideo && !btnPickVideo.contains(e.target)) {
        handlePickVideo();
      }
    };

    fileInput.onchange = (e) => {
      const files = [...(e.target.files || [])];
      if (files.length) uploadFiles(files, 'video');
      fileInput.value = '';
    };

    // Drag and Drop for Dropzone
    dropzoneEl.ondragover = (e) => {
      e.preventDefault();
      dropzoneEl.classList.add('dragover');
    };
    dropzoneEl.ondragleave = (e) => {
      e.preventDefault();
      dropzoneEl.classList.remove('dragover');
    };
    dropzoneEl.ondrop = (e) => {
      e.preventDefault();
      dropzoneEl.classList.remove('dragover');
      const files = [...(e.dataTransfer.files || [])];
      if (files.length) uploadFiles(files, 'video');
    };

    // Subtitle Picker Handler
    const handlePickSubtitle = async () => {
      try {
        const r = await api('POST', '/pick-file', { kind: 'subtitle' });
        const newPaths = r.paths && r.paths.length ? r.paths : (r.path ? [r.path] : []);
        if (newPaths.length) {
          subtitlePath = newPaths[0];
          renderFilesList();
        }
      } catch (err) {
        subFileInput.click();
      }
    };

    btnPickSubtitle.onclick = handlePickSubtitle;
    subFileInput.onchange = (e) => {
      const files = [...(e.target.files || [])];
      if (files.length) uploadFiles(files, 'subtitle');
      subFileInput.value = '';
    };

    btnPickImages.onclick = () => imgFileInput.click();
    imgFileInput.onchange = (e) => {
      const files = [...(e.target.files || [])].filter(f => /\.(png|jpe?g|webp)$/i.test(f.name));
      if (files.length) uploadFiles(files, 'media');
      imgFileInput.value = '';
    };

    // Text → voice mode
    let textMode = false;
    const speechEl = $('#npSpeech'), provEl = $('#npVoiceProv'), voiceEl = $('#npVoiceId'), voiceInfo = $('#npVoiceInfo'), voicePrev = $('#npVoicePrev');
    const updateSpeechInfo = () => { voiceInfo.textContent = `${speechEl.value.length} caracteres — a voz só é gerada ao criar o projeto (gasta crédito do provedor).`; };
    const loadVoices = async () => {
      voiceEl.innerHTML = '<option value="">Carregando vozes...</option>';
      try {
        const vs = await api('GET', `/voices/${provEl.value}`);
        voiceEl.innerHTML = vs.map(v => `<option value="${esc(v.id)}" data-prev="${esc(v.preview || '')}">${esc(v.name)}${v.gender ? ' · ' + esc(v.gender) : ''}${v.language ? ' · ' + esc(v.language) : ''}</option>`).join('') || '<option value="">Nenhuma voz</option>';
      } catch (err) { voiceEl.innerHTML = `<option value="">${esc(err.message)}</option>`; }
      voiceEl.onchange();
    };
    voiceEl.onchange = () => { const u = voiceEl.selectedOptions[0]?.dataset.prev; voicePrev.hidden = !u; if (u) voicePrev.src = u; };
    const charEl = $('#npChar');
    window.loadNpCharacters = async () => {
      try {
        const chars = (await api('GET', `/brands/${selectedBrand}`)).animation?.characters ?? [];
        charEl.innerHTML = '<option value="">Sem personagem</option>' + chars.filter(c => c.poses?.length).map(c => `<option value="${esc(c.name)}">${esc(c.name)} (${c.poses.length} poses)</option>`).join('');
      } catch { charEl.innerHTML = '<option value="">Sem personagem</option>'; }
    };
    provEl.onchange = loadVoices;
    speechEl.oninput = updateSpeechInfo;
    $('#npModeBar').querySelectorAll('[data-mode]').forEach(btn => btn.onclick = () => {
      textMode = btn.dataset.mode === 'text';
      $('#npModeBar').querySelectorAll('[data-mode]').forEach(x => x.classList.toggle('active', x === btn));
      $('#npTextBox').hidden = !textMode;
      for (const sel of ['#npDropzone', '#npFilesList', '#npSubtitleStrip', '#npMultiBox']) { const el = $(sel); if (el) el.style.display = textMode ? 'none' : ''; }
      if (textMode && !voiceEl.value) loadVoices();
      if (textMode) window.loadNpCharacters();
      updateSpeechInfo();
    });

    // Submit Action
    btnCreate.onclick = e => act(e.target, async () => {
      if (textMode) {
        if (!speechEl.value.trim() || !voiceEl.value) throw new Error('Cole o roteiro e escolha uma voz.');
        const st = await api('POST', '/projects', {
          name: nameInput.value.trim() || 'novo-video', text: speechEl.value, voice: { provider: provEl.value, voice: voiceEl.value }, character: charEl.value ? { name: charEl.value } : undefined,
          referenceUrl: refUrlInput.value.trim() || undefined, referenceNote: $('#npRefNote').value.trim() || undefined,
          preEdited: true, brand: selectedBrand, formatId: formatSelect.value || 'business-reels', images: imagePaths,
          composerMode: isAgentMode ? 'agent' : 'card', brollFill
        });
        location.hash = `#/p/${st.id}`;
        api('POST', `/projects/${st.id}/ingest`).catch(() => {});
        return;
      }
      if (!videoPaths.length) {
        throw new Error('Por favor, selecione ou envie pelo menos um arquivo de vídeo.');
      }

      const baseName = nameInput.value.trim() || 'novo-video';
      const formatId = formatSelect.value || 'business-reels';
      const brand = selectedBrand;
      const subtitle = subtitlePath || undefined;
      const referenceUrl = refUrlInput.value.trim() || undefined;
      const referenceNote = $('#npRefNote').value.trim() || undefined;
      const preEdited = selectedPre === '1';

      if (videoPaths.length > 1 && multiMode === 'batch') {
        btnCreate.disabled = true;
        btnCreate.innerHTML = `<span>Criando ${videoPaths.length} projetos...</span> <span class="step-spinner"></span>`;
        for (let i = 0; i < videoPaths.length; i++) {
          const vid = videoPaths[i];
          const clipName = vid.split('/').pop().replace(/\.[^/.]+$/, '');
          const projName = `${baseName}-${clipName || (i + 1)}`;
          const st = await api('POST', '/projects', {
            name: projName,
            video: vid,
            referenceUrl,
            referenceNote,
            preEdited,
            brand,
            formatId,
            images: imagePaths,
            composerMode: isAgentMode ? 'agent' : 'card',
            brollFill
          });
          api('POST', `/projects/${st.id}/ingest`).catch(() => {});
        }
        alert(`Criados ${videoPaths.length} projetos em lote com sucesso!`);
        dashCurrentTab = 'esteira';
        location.hash = '#/';
        return;
      }

      btnCreate.disabled = true;
      btnCreate.innerHTML = `<span>Criando e iniciando esteira...</span> <span class="step-spinner"></span>`;

      const st = await api('POST', '/projects', {
        name: baseName,
        videos: videoPaths,
        video: videoPaths[0],
        subtitle,
        referenceUrl,
        referenceNote,
        preEdited,
        brand,
        formatId,
        images: imagePaths,
        composerMode: isAgentMode ? 'agent' : 'card',
        brollFill
      });

      location.hash = `#/p/${st.id}`;
      api('POST', `/projects/${st.id}/ingest`).catch(() => {});
    });

    // Initial render
    renderFilesList();
    updateFooterStatus();
  }

  window.setDashFilter = (f) => {
    dashFilter = f;
    renderEsteiraGrid();
  };
  window.renderDashProjects = () => {
    if (location.hash === '' || location.hash === '#/' || location.hash === '#/projects') {
      if (dashCurrentTab === 'esteira') renderEsteiraGrid();
    }
  };

  renderView();
}

let es;
let timerInterval = null;
function clearTimer() {
  if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
}

async function project(id) {
  es?.close();
  clearTimer();
  let running = null; // { step: string, startedAt: number }

  function startTimer() {
    clearTimer();
    const tick = () => {
      if (!running) { clearTimer(); return; }
      const s = Math.max(0, Math.floor((Date.now() - (running.startedAt || Date.now())) / 1000));
      const m = Math.floor(s / 60), remS = s % 60;
      const fmt = m > 0 ? `${m}m ${remS < 10 ? '0' : ''}${remS}s` : `${s}s`;
      document.querySelectorAll('#running-elapsed, .running-elapsed-val').forEach(el => {
        el.textContent = fmt;
      });
      const bEl = $('#busy-timer');
      if (bEl) bEl.textContent = fmt;
    };
    tick();
    timerInterval = setInterval(tick, 1000);
  }

  function renderStepsBar(stepState, activeRunning, currentView) {
    const at = stepIdx(stepState);
    const runIdx = activeRunning ? (STEP_INFO[activeRunning.step]?.index ?? -1) : -1;
    const maxReachable = Math.max(at + 1, runIdx, at >= 3 ? 5 : -1);   // reviewed: edit and delivery open (the final itself still refuses open notes)

    $('#steps').innerHTML = STEPS.map(([sKey, n], i) => {
      let cls = [];
      let extra = '';

      const isClickable = i <= maxReachable;
      if (isClickable) cls.push('clickable');
      if (i <= at) cls.push('done');

      if (activeRunning && i === runIdx) {
        cls.push('running');
        extra = `<span class="step-spinner"></span>`;
      }

      if (sKey === currentView) {
        cls.push('cur-view');
      }

      return `<span class="${cls.join(' ')}" data-step="${sKey}" title="${isClickable ? 'Clique para ver a etapa ' + n : 'Etapa ainda não iniciada'}">${n} ${extra}</span>`;
    }).join('');

    $('#steps').querySelectorAll('span.clickable').forEach(el => {
      el.onclick = () => {
        const targetStep = el.dataset.step;
        if (targetStep && targetStep !== viewStep) {
          viewStep = targetStep;
          render();
        }
      };
    });
  }

  function updateBusyStatus() {
    const b = $('#busy');
    if (!b) return;
    if (running) {
      const info = STEP_INFO[running.step] || { short: running.step };
      b.innerHTML = `<span class="live-pill"><span class="pulse-dot"></span> rodando: <b>${esc(info.short)}</b> (<span id="busy-timer">0s</span>)</span>`;
      startTimer();
    } else {
      b.innerHTML = '';
      clearTimer();
    }
  }
  window.updateBusyStatus = updateBusyStatus;   // the step views (review, timeline) live outside this closure

  currentProjectId = id;

  app.innerHTML = `
    <div class="project-header-bar" style="display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px;flex-wrap:wrap">
      <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
        <h2 id="pt" style="margin:0;font-size:24px;letter-spacing:-.01em"></h2>
        <div id="pt-badges" style="display:inline-flex;align-items:center;gap:6px"></div>
      </div>
      <div id="pt-actions" style="display:inline-flex;align-items:center;gap:8px"></div>
    </div>
    <div class="steps" id="steps"></div><div id="body"></div>
    <div class="box"><h4>Progresso <span id="busy" style="text-transform:none;letter-spacing:0;color:var(--accent)"></span></h4><div id="log"></div><div id="cost" class="muted" style="font:11px var(--mono);margin-top:8px"></div></div>`;
  const log = $('#log'), line = s => appendToProjectLog(id, s, true);

  // Restaura imediatamente do cache em memória para a tela nunca reiniciar
  if (projectLogsMap.has(id) && projectLogsMap.get(id).length) {
    const cached = projectLogsMap.get(id);
    log.textContent = cached.join('\n') + '\n';
    log.scrollTop = log.scrollHeight;
  }

  // Carrega histórico completo de logs desde a criação do projeto
  api('GET', `/projects/${encodeURIComponent(id)}/logs`).then(serverLogs => {
    if (Array.isArray(serverLogs) && serverLogs.length) {
      const local = projectLogsMap.get(id) || [];
      const combined = [...serverLogs];
      for (const item of local) {
        if (!combined.includes(item)) combined.push(item);
      }
      projectLogsMap.set(id, combined);
      if (currentProjectId === id && log) {
        log.textContent = combined.join('\n') + '\n';
        log.scrollTop = log.scrollHeight;
      }
    }
  }).catch(() => {});

  es = new EventSource(`/projects/${id}/events`);
  es.addEventListener('log', e => appendToProjectLog(id, JSON.parse(e.data), false));
  es.addEventListener('step', e => {
    refreshProjectsSidebar();
    const d = JSON.parse(e.data);
    const isMajor = ['ingest', 'script', 'motion', 'final'].includes(d.step);
    if (d.status === 'start') {
      running = { step: d.step, startedAt: d.startedAt || Date.now() };
      if (isMajor) {
        const curIdx = STEPS.findIndex(s => s[0] === viewStep);
        const startIdx = STEP_INFO[d.step]?.index ?? 0;
        if (!viewStep || viewStep === 'created' || curIdx <= startIdx) {
          viewStep = d.step;
        }
        updateBusyStatus();
        render();
      } else {
        updateBusyStatus();
      }
    } else if (d.status === 'done') {
      running = null;
      updateBusyStatus();
      if (isMajor) {
        if (d.step === 'ingest') {
          // Ingestão concluída com sucesso: avança automaticamente a visualização e esteira para o Roteiro
          viewStep = 'script';
          line('⚡ Ingestão concluída! Avançando esteira: iniciando Etapa 2 (Roteiro com IA)...');
          running = { step: 'script', startedAt: Date.now() };
          updateBusyStatus();
          render();
          api('POST', `/projects/${id}/script`).catch(err => {
            running = null;
            updateBusyStatus();
            line(`ERRO na geração do roteiro: ${err.message}`);
            render();
          });
        } else if (d.step === 'script') {
          viewStep = 'script';
          render();
        } else if (d.step === 'motion') {
          viewStep = 'motion';
          render();
        } else {
          render();
        }
      }
    } else if (d.status === 'error') {
      running = null;
      updateBusyStatus();
      line(`ERRO na etapa ${d.step || ''}: ${d.error}`);
      if (isMajor) {
        render();
      }
    }
  });

  let viewStep = null;
  window.switchProjectStep = (sKey) => {
    viewStep = sKey;
    render();
  };
  window.renderProject = render;
  window.setProjectRunning = (r) => {
    running = r;
    updateBusyStatus();
  };
  window.getProjectRunning = () => running;

  async function render() {
    const st = await api('GET', `/projects/${id}`);
    if (st.running) {
      running = st.running;
    } else if (running && !['batch', 'edit', 'ask'].includes(running.step)) {
      running = null;
    }

    const at = stepIdx(st.step);
    const runIdx = running ? (STEP_INFO[running.step]?.index ?? -1) : -1;
    const maxReachable = Math.max(at + 1, runIdx, at >= 3 ? 5 : -1);   // reviewed: edit and delivery open (the final itself still refuses open notes)
    const isMajorRunning = running && ['ingest', 'script', 'motion', 'final'].includes(running.step);
    const activePipelineStep = isMajorRunning ? running.step : (st.step === 'brand' ? 'script' : st.step);

    if (!viewStep || (STEPS.findIndex(s => s[0] === viewStep) > maxReachable && viewStep !== 'brand')) {
      viewStep = activePipelineStep;
    }

    $('#pt').textContent = st.name || id;
    const badgesEl = $('#pt-badges');
    if (badgesEl) {
      const isAgent = st.composed || st.composerMode === 'agent';
      badgesEl.innerHTML = `
        ${st.brand ? `<span style="background:var(--panel2);border:1px solid var(--line);padding:2px 8px;border-radius:4px;font:600 11px var(--sans);color:var(--cream)">${esc(st.brand)}</span>` : ''}
        <button id="btn-toggle-composer-mode" style="display:inline-flex;align-items:center;gap:5px;background:${isAgent ? 'rgba(168,85,247,0.18)' : 'rgba(59,130,246,0.14)'};color:${isAgent ? '#d8b4fe' : '#93c5fd'};border:1px solid ${isAgent ? 'rgba(168,85,247,0.45)' : 'rgba(59,130,246,0.35)'};padding:2px 8px;border-radius:12px;font:700 11px var(--mono);cursor:pointer;transition:all .15s ease" title="Clique para alternar o modo de composição (Agente HyperFrames vs Cards)">
          ${isAgent ? '🤖 MODO AGENTE' : '🃏 MODO CARDS'}
        </button>
        ${st.completed ? `<span class="badge-done-pill" style="display:inline-flex;align-items:center;gap:5px;background:rgba(0,230,118,0.12);color:#00e676;border:1px solid rgba(0,230,118,0.3);padding:3px 9px;border-radius:12px;font:700 11px var(--mono)">✓ CONCLUÍDO</span>` : ''}
      `;
      const btnMode = $('#btn-toggle-composer-mode');
      if (btnMode) {
        btnMode.onclick = async () => {
          const nextMode = isAgent ? 'card' : 'agent';
          const label = nextMode === 'agent' ? 'Modo Agente (liberdade criativa HyperFrames)' : 'Modo Cards (estruturado)';
          if (!confirm(`Alternar composição deste projeto para ${label}?`)) return;
          await api('POST', `/projects/${id}/composer-mode`, { mode: nextMode });
          render();
        };
      }
    }
    const actionsEl = $('#pt-actions');
    if (actionsEl) {
      if (st.completed) {
        actionsEl.innerHTML = `
          <button id="btn-toggle-complete" style="font-size:12px;padding:6px 14px;background:var(--panel2);border:1px solid var(--line);color:var(--mute);border-radius:6px;cursor:pointer">
            ↺ Reabrir Projeto
          </button>`;
      } else {
        actionsEl.innerHTML = `
          <button id="btn-toggle-complete" style="font-size:12px;padding:6px 14px;background:rgba(0,230,118,0.12);border:1px solid rgba(0,230,118,0.4);color:#00e676;font-weight:700;border-radius:6px;cursor:pointer" title="Marcar este projeto como concluído e arquivá-lo">
            ✓ Concluir Projeto
          </button>`;
      }
      const completeBtn = $('#btn-toggle-complete');
      if (completeBtn) {
        completeBtn.onclick = async () => {
          const nextState = !st.completed;
          if (nextState) {
            if (!confirm(`Deseja encerrar e marcar "${st.name || id}" como Concluído?\nEle deixará de exibir alertas de ação pendente na esteira.`)) return;
          }
          await api('POST', `/projects/${id}/complete`, { completed: nextState });
          refreshProjectsSidebar();
          render();
        };
      }
    }
    renderStepsBar(st.step, running, viewStep);
    updateBusyStatus();

    const cost = {};
    st.cost.forEach(c => { const m = cost[c.model] ??= { in: 0, out: 0, cache: 0 }; m.in += c.in; m.out += c.out; m.cache += c.cacheRead + c.cacheWrite; });
    $('#cost').textContent = Object.entries(cost).map(([m, c]) => `${m}: ${c.in}+${c.cache} in / ${c.out} out`).join(' · ');

    // a fresh container per render: an older render still awaiting its data then fills a detached node, not the current screen
    const body = document.createElement('div');
    $('#body').replaceChildren(body);

    // Se o usuário está visualizando EXATAMENTE a etapa principal que está rodando
    if (isMajorRunning && viewStep === running.step) {
      const info = STEP_INFO[running.step] || { title: `Executando ${running.step}...`, desc: 'Processamento em andamento...', short: running.step };
      body.innerHTML = `
        <div class="box running-step-box">
          <div class="running-step-head">
            <div class="spinner-large"></div>
            <div style="flex:1">
              <div style="display:flex;align-items:center;gap:10px;margin-bottom:6px;flex-wrap:wrap">
                <span class="running-badge-pill"><span class="pulse-dot"></span> EM EXECUÇÃO</span>
                <h3 style="margin:0;font-size:22px;color:var(--cream);letter-spacing:-.01em">${esc(info.title)}</h3>
              </div>
              <p style="margin:0 0 10px;font-size:13px;color:var(--mute);line-height:1.5;">${esc(info.desc)}</p>
              <div class="running-metrics">
                <div class="metric-item">
                  <span class="metric-label">Tempo decorrido</span>
                  <span class="metric-val" id="running-elapsed">0s</span>
                </div>
                <div class="metric-item">
                  <span class="metric-label">Etapa atual</span>
                  <span class="metric-val" style="color:var(--accent)">${esc(info.short)}</span>
                </div>
              </div>
            </div>
          </div>
          <div class="running-bar-track"><div class="running-bar-fill"></div></div>
          <div style="margin-top:14px;padding-top:12px;border-top:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px">
            <span class="muted" style="font:11px var(--mono)">Acompanhe o terminal em "Progresso" abaixo para ver os logs detalhados. Você pode navegar em etapas anteriores pelo menu acima sem interferir na execução.</span>
            <button class="primary" disabled style="opacity:0.65;cursor:not-allowed">
              <span class="step-spinner" style="border-top-color:var(--ink);border-color:rgba(0,0,0,0.25)"></span> ${esc(info.short)} em andamento...
            </button>
          </div>
        </div>`;
      startTimer();
      return;
    }

    if (viewStep === 'created') {
      body.innerHTML = `
        <div class="box">
          <h3>Vídeo do Projeto</h3>
          <div style="margin:12px 0">
            <p><b>Nome do projeto:</b> ${esc(st.name)}</p>
            <p><b>Brand:</b> ${esc(st.brand)}</p>
            <p><b>Formatos:</b> ${(st.formats || []).join(', ') || 'Nenhum'}</p>
            ${st.subtitle ? `<p><b>Legenda original:</b> ${esc(st.subtitle)}</p>` : ''}
          </div>
          <div style="margin-top:16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap">
            ${maxReachable > 0 ? `
              <button class="primary" id="btn-to-ingest">Ver Ingestão (Etapa 1) ➔</button>
            ` : `
              <button class="primary" id="go">Rodar etapa 1</button>
            `}
          </div>
        </div>`;
      const bti = $('#btn-to-ingest');
      if (bti) bti.onclick = () => { viewStep = 'ingest'; render(); };
      const go = $('#go');
      if (go) go.onclick = e => act(e.target, async () => {
        running = { step: 'ingest', startedAt: Date.now() };
        viewStep = 'ingest';
        render();
        await api('POST', `/projects/${id}/ingest`);
      });
    } else if (viewStep === 'ingest') {
      const isPast = maxReachable >= 2;
      body.innerHTML = `
        <div class="box">
          <h3>Etapa 1: Ingestão de Vídeo</h3>
          <p class="muted">Plano de cortes e transcrição gerados na ingestão.</p>
          <pre style="max-height:220px;overflow:auto">${esc(JSON.stringify(st.plan, null, 2))}</pre>
          <div style="margin-top:16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap">
            ${isPast ? `
              <button class="primary" id="btn-to-script">Ver Roteiro (Etapa 2) ➔</button>
              <button id="btn-re-script" style="color:var(--mute)">Regenerar Roteiro com IA</button>
            ` : `
              <button class="primary" id="go">Etapa 2: sugerir roteiro</button>
            `}
          </div>
        </div>`;
      const bts = $('#btn-to-script');
      if (bts) bts.onclick = () => { viewStep = 'script'; render(); };
      const brs = $('#btn-re-script');
      if (brs) brs.onclick = e => {
        if (confirm('Atenção: Regenerar o roteiro com IA substituirá as alterações feitas na Etapa 2. Deseja continuar?')) {
          act(e.target, async () => {
            running = { step: 'script', startedAt: Date.now() };
            viewStep = 'script';
            render();
            await api('POST', `/projects/${id}/script`);
          });
        }
      };
      const go = $('#go');
      if (go) go.onclick = e => act(e.target, async () => {
        running = { step: 'script', startedAt: Date.now() };
        viewStep = 'script';
        render();
        await api('POST', `/projects/${id}/script`);
      });
    } else if (viewStep === 'script') {
      await scriptStep(id, body);
    } else if (viewStep === 'motion') {
      if (maxReachable >= 3) {
        await reviewStep(id, body, st);
      } else {
        body.innerHTML = `
          <div class="box">
            <h3>Etapa 3: Revisão</h3>
            <p class="muted">Aprove o roteiro (Etapa 2): o Claude gera os cards e o vídeo abre aqui no player ao vivo.</p>
            <button class="primary" id="to-script">Ir para o Roteiro (Etapa 2) ➔</button>
          </div>`;
        $('#to-script').onclick = () => { viewStep = 'script'; render(); };
      }
    } else if (viewStep === 'edit') {
      if (maxReachable >= 4) await editStep(id, body, st);
      else {
        body.innerHTML = `<div class="box"><h3>Etapa 4: Edição</h3><p class="muted">Gere e revise o vídeo na Etapa 3 antes de editar as camadas.</p>
          <button class="primary" id="to-review">Ir para a Revisão (Etapa 3) ➔</button></div>`;
        $('#to-review').onclick = () => { viewStep = 'motion'; render(); };
      }
    } else if (viewStep === 'final') {
      if (maxReachable >= 5) {
        await deliveryStep(id, body, st);
      } else {
        body.innerHTML = `
          <div class="box">
            <h3>Etapa 5: Entrega</h3>
            <p class="muted">Revise e aprove o vídeo na Etapa 3 antes das entregas.</p>
            <button class="primary" id="to-review">Ir para a Revisão (Etapa 3) ➔</button>
          </div>`;
        $('#to-review').onclick = () => { viewStep = 'motion'; render(); };
      }
    }

    // Se o usuário estiver visualizando uma etapa diferente do ponto atual do projeto, adiciona banner superior com a barra de processo ativa
    if (viewStep !== activePipelineStep) {
      const curMeta = STEP_INFO[viewStep] || { name: viewStep };
      const activeMeta = STEP_INFO[activePipelineStep] || { name: activePipelineStep };
      const activeInfo = STEP_INFO[activePipelineStep] || { title: `Etapa ${activePipelineStep} em execução`, desc: 'Processamento em andamento...', short: activePipelineStep };
      const banner = document.createElement('div');
      if (isMajorRunning) {
        banner.className = 'box running-step-box';
        banner.style.marginBottom = '20px';
        banner.innerHTML = `
          <div class="running-step-head">
            <div class="spinner-large" style="width:36px;height:36px;border-width:3px"></div>
            <div style="flex:1">
              <div style="display:flex;align-items:center;gap:10px;margin-bottom:6px;flex-wrap:wrap">
                <span class="running-badge-pill"><span class="pulse-dot"></span> EM EXECUÇÃO</span>
                <h3 style="margin:0;font-size:18px;color:var(--cream);letter-spacing:-.01em">${esc(activeInfo.title)}</h3>
                <span class="nav-step-tag" style="margin-left:auto">Visualizando ${esc(curMeta.name || viewStep)}</span>
              </div>
              <p style="margin:0 0 10px;font-size:13px;color:var(--mute);line-height:1.5;">${esc(activeInfo.desc)}</p>
              <div class="running-metrics">
                <div class="metric-item">
                  <span class="metric-label">Tempo decorrido</span>
                  <span class="metric-val running-elapsed-val" id="running-elapsed">0s</span>
                </div>
                <div class="metric-item">
                  <span class="metric-label">Etapa em execução</span>
                  <span class="metric-val" style="color:var(--accent)">${esc(activeInfo.short)}</span>
                </div>
              </div>
            </div>
            <div>
              <button id="nav-return-btn" class="nav-return-btn" style="padding:10px 18px;font-size:12px;font-weight:700">
                Ver ${esc(activeMeta.name || activePipelineStep)} (em andamento) ➔
              </button>
            </div>
          </div>
          <div class="running-bar-track"><div class="running-bar-fill"></div></div>
          <div style="margin-top:12px;padding-top:10px;border-top:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px">
            <span class="muted" style="font:11px var(--mono)">Execução ativa em segundo plano. Você pode navegar em etapas anteriores pelo menu acima sem interferir no processo.</span>
          </div>
        `;
        startTimer();
      } else {
        banner.className = 'nav-step-banner';
        banner.innerHTML = `
          <div class="nav-step-left">
            <span class="nav-step-tag">Visualizando ${esc(curMeta.name || viewStep)}</span>
            <span class="nav-step-info">
              O projeto já avançou até a etapa <b>${esc(activeMeta.name || activePipelineStep)}</b>. Navegue livremente sem perder nada do que já foi enviado.
            </span>
          </div>
          <button id="nav-return-btn" class="nav-return-btn">
            Ir para ${esc(activeMeta.name || activePipelineStep)} ➔
          </button>
        `;
      }
      body.insertBefore(banner, body.firstChild);
      const retBtn = $('#nav-return-btn');
      if (retBtn) retBtn.onclick = () => {
        viewStep = activePipelineStep;
        render();
      };
    }
  }
  render();
}

// Step 2: Manter / Mudar / Remover per moment
async function scriptStep(id, body) {
  let s = null;
  let project = {};
  try {
    const res = await Promise.all([
      api('GET', `/projects/${id}/files/script.json`),
      api('GET', `/projects/${id}`).catch(() => ({}))
    ]);
    s = res[0];
    project = res[1];
  } catch (err) {
    body.innerHTML = `
      <div class="box">
        <h3>Etapa 2: Roteiro & Direção de Motion</h3>
        <p class="muted">O roteiro com IA ainda não foi gerado para este projeto.</p>
        <div style="margin-top:16px">
          <button class="primary" id="btn-run-script-fallback">Gerar Roteiro com IA (Claude Opus) ⚡</button>
        </div>
      </div>`;
    $('#btn-run-script-fallback')?.addEventListener('click', e => act(e.target, async () => {
      if (typeof window.setProjectRunning === 'function') window.setProjectRunning({ step: 'script', startedAt: Date.now() });
      if (typeof window.renderProject === 'function') window.renderProject();
      await api('POST', `/projects/${id}/script`);
    }));
    return;

  const brandName = project?.brand || 'padrao';
  const [bData, bMd] = await Promise.all([

    api('GET', `/brands/${brandName}/md`).catch(() => '')
  ]);

  body.innerHTML = `<div class="box">
    ${renderBrandGuideBar(bData, bMd, '.m-obs, .m-text')}

        <td><select class="m-card" style="width:100%">${cardOpts(m.tipo_card)}</select></td>
        <td><input class="m-text" value="${esc(m.texto)}" style="width:100%"></td>
        <td style="min-width:320px">

    if (info) {
      info.innerHTML = `Linha selecionada: <span style="color:var(--accent)">#${selectedIdx + 1} (${start}s – ${end}s)</span> · Card: <span style="color:var(--accent);text-transform:uppercase;">${curType}</span>`;
    }
    body.querySelectorAll('.card-tile').forEach(tile => {
      tile.classList.toggle('active', tile.dataset.type === curType);
    });
  }

  function selectRow(idx) {
    selectedIdx = idx;
    const trs = body.querySelectorAll('tr[data-i]');
    trs.forEach((tr, i) => {
      tr.classList.toggle('row-selected', i === idx);
    });
    updateTileSelection();
  }

  body.querySelectorAll('tr[data-i]').forEach((tr, i) => {
    const actSel = tr.querySelector('.m-act');
    const chk = tr.querySelector('.m-chk');
    const chkLbl = tr.querySelector('.m-chk-lbl');
    const viewBox = tr.querySelector('.m-motivo-view');
    const editBox = tr.querySelector('.m-motivo-edit');
    const obsInp = tr.querySelector('.m-obs');
    const cardSel = tr.querySelector('.m-card');
    const startInp = tr.querySelector('.m-start');
    const endInp = tr.querySelector('.m-end');
    const textInp = tr.querySelector('.m-text');
    const fields = [startInp, endInp, cardSel, textInp, obsInp];

    tr.addEventListener('click', () => selectRow(i));
    fields.forEach(f => f.addEventListener('focus', () => selectRow(i)));

    const setChange = (val, focus = false) => {
      chk.checked = val;
      chkLbl.textContent = val ? 'Trocar animação ✓' : 'Trocar animação';
      chkLbl.style.color = val ? 'var(--yellow)' : 'var(--mute)';
      viewBox.style.display = val ? 'none' : 'block';
      editBox.style.display = val ? 'block' : 'none';
      if (val) {
        if (actSel.value !== 'remove') actSel.value = 'change';
        if (focus) obsInp.focus();
      } else {
        if (actSel.value === 'change') actSel.value = 'keep';
      }
      updateTileSelection();
    };

    chk.onchange = () => setChange(chk.checked, chk.checked);
    viewBox.onclick = () => setChange(true, true);

    cardSel.onchange = () => {
      setChange(true, false);
      updateTileSelection();
    };
    obsInp.oninput = () => {
      if (actSel.value !== 'remove') actSel.value = 'change';
      chk.checked = true;
      chkLbl.style.color = 'var(--yellow)';
    };

    [startInp, endInp, textInp].forEach(el => {
      el.oninput = el.onchange = () => {
        if (actSel.value !== 'remove') actSel.value = 'change';
      };
    });

    actSel.onchange = () => {
      const isRemove = actSel.value === 'remove';
      const isChange = actSel.value === 'change';
      const isKeep = actSel.value === 'keep';
      tr.classList.toggle('removed', isRemove);
      chk.disabled = isRemove;
      fields.forEach(f => f.disabled = isRemove);
      if (isRemove) {
        setChange(false);
      } else if (isChange) {
        setChange(true, false);
      } else if (isKeep) {
        setChange(false);
        const orig = s.moments[Number(tr.dataset.i)];
        if (orig) {
          startInp.value = orig.t_start;
          endInp.value = orig.t_end;
          cardSel.value = (orig.tipo_card || 'custom').trim().toLowerCase();
          textInp.value = orig.texto;
          obsInp.value = orig.observacao || '';
        }
      }
      updateTileSelection();
    };
  });

  // Clique nos cards do catálogo na parte inferior aplica à linha selecionada
  body.querySelectorAll('.card-tile').forEach(tile => {
    tile.onclick = () => {
      const type = tile.dataset.type;
      const trs = body.querySelectorAll('tr[data-i]');
      const tr = trs[selectedIdx] || trs[0];
      if (!tr) return;
      const cardSel = tr.querySelector('.m-card');
      if (cardSel) {
        cardSel.value = type;
        cardSel.dispatchEvent(new Event('change'));
        selectRow(Number(tr.dataset.i));
        const start = tr.querySelector('.m-start')?.value;
        const end = tr.querySelector('.m-end')?.value;
        line(`[edição] Linha #${selectedIdx + 1} (${start}s – ${end}s): card alterado para "${type.toUpperCase()}"`);
      }
    };
  });

  // Seleciona a primeira linha ao abrir
  selectRow(0);

  // Conecta eventos do Guia da Marca (clique copia hex, clique em emoji insere no input focado)
  attachBrandGuideEvents(body, bData, bMd, '.m-obs, .m-text');

  const line = s => appendToProjectLog(id, s, true);
  const handleRedo = async (btn) => {
    if (!confirm('Atenção: Regenerar o roteiro com IA descartará as edições manuais deste roteiro. Deseja continuar?')) return;
    act(btn, async () => {
      line('$ Regenerando roteiro com IA...');
      if (typeof window.setProjectRunning === 'function') {
        window.setProjectRunning({ step: 'script', startedAt: Date.now() });
      }
      if (typeof window.switchProjectStep === 'function') {
        window.switchProjectStep('script');
      } else if (typeof window.renderProject === 'function') {
        window.renderProject();
      }
      await api('POST', `/projects/${id}/script`);
    });
  };

  const handleApprove = async (btn) => {
    const approveBtns = body.querySelectorAll('.btn-approve-script');
    approveBtns.forEach(b => {
      b.disabled = true;
      b.innerHTML = '<span class="step-spinner"></span> Salvando roteiro e avançando...';
    });
    line(`$ Salvando modificações do roteiro (${body.querySelectorAll('tr[data-i]').length} momentos)...`);

    try {
      const moments = [...body.querySelectorAll('tr[data-i]')].filter(tr => tr.querySelector('.m-act').value !== 'remove').map(tr => {
        const a = tr.querySelector('.m-start');
        const b = tr.querySelector('.m-end');
        const t = tr.querySelector('.m-card');
        const x = tr.querySelector('.m-text');
        const obsInp = tr.querySelector('.m-obs');
        const obs = (obsInp ? obsInp.value : '').trim();
        const orig = s.moments[tr.dataset.i];
        const origMotivo = orig.orig_motivo || (orig.motivo ? orig.motivo.replace(/\s*\[Alteração:.*?\]$/, '') : '');
        const finalMotivo = obs ? (origMotivo ? `${origMotivo} [Alteração: ${obs}]` : obs) : origMotivo;
        return {
          ...orig,
          orig_motivo: origMotivo,
          t_start: Number(a.value),
          t_end: Number(b.value),
          tipo_card: t.value,
          texto: x.value,
          motivo: finalMotivo,
          observacao: obs || undefined
        };
      });

      await api('PUT', `/projects/${id}/script`, { ...s, moments });
      line(`✓ Roteiro aprovado com sucesso (${moments.length} momentos).`);
      line('→ Claude Opus gerando os cards a partir do roteiro; o vídeo abre na Revisão (Etapa 3)...');

      if (typeof window.setProjectRunning === 'function') window.setProjectRunning({ step: 'motion', startedAt: Date.now() });
      if (typeof window.switchProjectStep === 'function') window.switchProjectStep('motion');

      api('POST', `/projects/${id}/motion`).catch(err => {
        if (typeof window.setProjectRunning === 'function') window.setProjectRunning(null);
        line(`ERRO na geração dos cards: ${err.message}`);
        alert(`Erro na geração dos cards: ${err.message}`);
        if (typeof window.renderProject === 'function') window.renderProject();
      });
    } catch (err) {
      approveBtns.forEach(b => {
        b.disabled = false;
        b.innerHTML = 'Aprovar roteiro e gerar o vídeo ➔';
      });
      line(`ERRO ao aprovar roteiro: ${err.message}`);
      alert(`Erro ao salvar roteiro: ${err.message}`);
    }
  };

  body.querySelectorAll('.btn-approve-script').forEach(btn => {
    btn.onclick = () => handleApprove(btn);
  });
  body.querySelectorAll('.btn-redo-script').forEach(btn => {
    btn.onclick = () => handleRedo(btn);
  });
}

// Step 3: cor → fonte → legenda → ícones, each prefilled; OK merges into this project's override
async function brandWizard(id, body, k = 0) {
  const [st, bl] = await Promise.all([api('GET', `/projects/${id}`), api('GET', '/brands')]);
  const base = await api('GET', `/brands/${st.brand}`);
  const merged = structuredClone(base);
  (function m(a, o) { for (const [k, v] of Object.entries(o)) v && typeof v === 'object' && !Array.isArray(v) ? m(a[k] ??= {}, v) : a[k] = v; })(merged, st.override);
  merged.captionStyle = capStyle(merged);
  const pages = [['colors', 'Cor'], ['fonts', 'Fonte'], ['captions', 'Legenda'], ['icons', 'Ícones']];
  const [key, title] = pages[k];
  const form = key === 'captions' ? { captionStyle: merged.captionStyle, captions: merged.captions } : { [key]: merged[key] };
  const stepTitle = key === 'fonts' ? 'Fonte (Tipografia Premiere)' : title;
  const hasCards = stepIdx(st.step) >= 3;   // the cards exist
  const okText = k < 3 ? 'OK' : (hasCards ? 'OK, salvar e ir para a Revisão ➔' : 'OK, gerar o vídeo e revisar ➔');

  body.innerHTML = `<div class="box"><h3>Etapa 3: brand (${k + 1}/4) — ${stepTitle}</h3>
    <p>Brand <select id="bsel">${bl.map(b => `<option ${b === st.brand ? 'selected' : ''}>${esc(b)}</option>`).join('')}</select>
      <span class="muted">trocar descarta as mudanças deste projeto</span></p>
    <div class="row"><div style="flex:1" id="wf">${key === 'icons' || key === 'fonts' ? '' : fields(form) + (key === 'captions' ? `<div id="animbox">${animFields(effAnim(merged))}</div>` : '')}</div>
      <div style="flex:1">${key !== 'icons' ? `<div id="cp">${capPreview(merged, st.brand)}</div>` : ''}<div id="wff"></div></div></div>
    <p><input id="txt" size="50" placeholder='ou peça em texto: "deixa mais sóbrio"'> <button id="ask">Pedir ao Claude</button></p>
    <p>${k ? '<button id="back">Voltar</button>' : ''} <button class="primary" id="ok">${okText}</button>
      <button id="def">Salvar como padrão da brand</button></p></div>`;
  if (key === 'icons') {
    $('#wf').innerHTML = (merged.icons ?? []).map(i => `<div>${esc(i.name)} <span class="muted">${esc(i.tags.join(', '))}</span></div>`).join('') || '<p class="muted">nenhum ícone</p>';
    $('#wf').append(iconForm(st.brand, () => brandWizard(id, body, k)));
  }
  if (key === 'fonts') {
    $('#wf').innerHTML = '';
    renderPremiereFontPanel($('#wf'), merged, st.brand, id, () => {
      if ($('#cp')) $('#cp').innerHTML = capPreview(merged, st.brand);
    });
  }
  if (key === 'captions') animHooks($('#wf'));
  $('#wf').oninput = $('#wf').onchange = () => {
    if (key !== 'fonts' && $('#cp')) $('#cp').innerHTML = capPreview({ ...merged, ...read($('#wf')) }, st.brand);
  };
  $('#bsel').onchange = e => act(e.target, async () => { await api('POST', `/projects/${id}/brand`, { brand: e.target.value }); brandWizard(id, body, k); });
  $('#ask').onclick = e => act(e.target, async () => { await api('POST', `/projects/${id}/brand`, { text: $('#txt').value }); brandWizard(id, body, k); });
  $('#def').onclick = e => act(e.target, async () => {
    if (key === 'fonts') await api('POST', `/projects/${id}/brand`, { override: { fonts: merged.fonts, captionStyle: merged.captionStyle } });
    else if (key !== 'icons') await api('POST', `/projects/${id}/brand`, { override: read($('#wf')) });
    await api('POST', `/projects/${id}/brand/save-default`);
    brandWizard(id, body, k);
  });
  if (k) $('#back').onclick = () => brandWizard(id, body, k - 1);
  $('#ok').onclick = e => act(e.target, async () => {
    const override = key === 'fonts' ? { fonts: merged.fonts, captionStyle: merged.captionStyle } : (key === 'icons' ? {} : read($('#wf')));
    await api('POST', `/projects/${id}/brand`, { override });
    if (k < 3) return brandWizard(id, body, k + 1);
    if (hasCards) {
      if (typeof window.switchProjectStep === 'function') window.switchProjectStep('motion');
      else motionGo(id, body, st);
    } else {
      act(e.target, async () => {
        if (typeof window.switchProjectStep === 'function') window.switchProjectStep('motion');
        await api('POST', `/projects/${id}/motion`);
      });
    }
  });
}
