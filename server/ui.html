// Step 3: review in the live HyperFrames player (proj/index.html, no render), notes pinned to a time and a spot on the frame.
// The notes go to Claude in one round, the player reloads with the result; approving opens the delivery step.
let hfPlayerLoad = null;
const loadHfPlayer = () => hfPlayerLoad ??= new Promise((ok, ko) => document.head.appendChild(Object.assign(document.createElement('script'), {
  src: '/hf/hyperframes-player.global.js', onload: ok, onerror: () => { hfPlayerLoad = null; ko(new Error('o player HyperFrames não carregou')); },
})));
const RV_FPS = 30;
const tcode = t => {
  const f = Math.floor((t || 0) * RV_FPS + 1e-6), s = Math.floor(f / RV_FPS);
  return [Math.floor(s / 3600), Math.floor(s / 60) % 60, s % 60, f % RV_FPS].map(n => String(n).padStart(2, '0')).join(':');
};
const RV_STATUS = { open: 'aberta', done: 'aplicada ✓', skipped: 'não aplicada' };

async function reviewStep(id, body, st) {
  let rv = await api('GET', `/projects/${id}/review`);
  const SPEEDS = [1, 1.5, 2, 2.5];
  let rate = 1;
  try { rate = SPEEDS.includes(Number(localStorage.getItem('rv_rate'))) ? Number(localStorage.getItem('rv_rate')) : 1; } catch {}
  let P = null, filter = 'all', pinning = false, draft = null, selId = null, applying = false, pinKey = '', markKey = '';

  body.innerHTML = `<div class="box"><h3>Etapa 3: revisão</h3>
    <p class="muted" style="margin-top:0">Assista ao vivo, sem renderizar. Pause onde quer mudar, escreva a anotação e, se quiser, marque o ponto no quadro ou um trecho (Início/Fim, teclas I/O).
      Envie todas de uma vez para o Claude: o player recarrega com as mudanças. Quando estiver bom, aprove para ir às entregas.</p>
    <div class="rv">
      <div class="rv-player">
        <div class="rv-stage" id="rv-stage"></div>
        <div class="rv-scrub" id="rv-scrub" title="Clique ou arraste para navegar"><div class="trk"></div><div class="fill"></div><div id="rv-marks"></div><div class="knob"></div></div>
        <div class="rv-bar">
          <button id="rv-play" title="Play / pausa (espaço)">▶</button>
          <button id="rv-back" title="Voltar 1 quadro (←)">◀︎|</button>
          <button id="rv-fwd" title="Avançar 1 quadro (→)">|▶︎</button>
          <span class="rv-tc" id="rv-tc">00:00:00:00</span>
          <div class="rv-speeds">${SPEEDS.map(s => `<button data-s="${s}">${String(s).replace('.', ',')}x</button>`).join('')}</div>
        </div>
        <p class="muted" style="font-size:11px;margin:0">Espaço: play/pausa · I / O: início / fim do trecho · ← / →: 1 quadro · Shift + ← / →: 1 segundo · clique no vídeo: play/pausa</p>
      </div>
      <div class="rv-notes">
        <div class="rv-notes-head"><b>Anotações</b><span class="muted" id="rv-count" style="font-size:12px"></span>
          <div class="tabs"><button data-f="open">Abertas</button><button data-f="all">Todas</button></div></div>
        <div class="rv-list" id="rv-list"></div>
        <div class="rv-compose">
          <textarea id="rv-text" placeholder="Pause no momento e descreva a alteração... (Enter adiciona, Shift+Enter quebra a linha)"></textarea>
          <div class="rv-compose-row">
            <span class="chip" id="rv-at" title="Tempo da anotação">00:00:00:00</span>
            <button id="rv-in" title="Início do trecho = posição atual (I)">⇤ Início</button>
            <button id="rv-out" title="Fim do trecho = posição atual (O). Sem trecho, a anotação é pontual">Fim ⇥</button>
            <button id="rv-pin" title="Clique e depois clique no vídeo para marcar o local">📍 Marcar ponto</button>
            <button class="primary" id="rv-add" style="margin-left:auto">Adicionar</button>
          </div>
        </div>
        <div class="rv-apply"><button class="primary" id="rv-send"></button><span class="muted" id="rv-status" style="font-size:12px"></span></div>
      </div>
    </div>
    <div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:18px;padding-top:14px;border-top:1px solid var(--line)">
      <span class="muted" style="font-size:12px">Sem anotações abertas, o vídeo pode ser aprovado.</span>
      <button class="primary" id="rv-final" style="margin-left:auto">✓ Aprovar vídeo e ir para a Edição (Etapa 4) ➔</button>
    </div>
  </div>`;

  const stage = $('#rv-stage'), scrub = $('#rv-scrub'), text = $('#rv-text');
  const alive = () => document.contains(stage);
  const now = () => P?.currentTime || 0;
  const dur = () => P?.duration || 0;
  const seek = t => { if (!P) return; t = Math.max(0, Math.min(dur() || t, t)); P.seek ? P.seek(t) : (P.currentTime = t); };
  const sorted = () => [...rv.notes].sort((a, b) => a.t - b.t);
  const numOf = n => sorted().indexOf(n) + 1;
  const span = n => tcode(n.t) + (n.end != null ? ' → ' + tcode(n.end) : '');
  const openCount = () => rv.notes.filter(n => n.status === 'open').length;

  // the player: the live composition, or the rendered preview for a reel the agent composer made
  async function mount(keepT = 0) {
    P = null;
    if (rv.mode === 'none') {
      stage.innerHTML = `<div class="rv-msg"><div>O preview ao vivo deste projeto ainda não foi montado.</div><button class="primary" id="rv-build">Montar preview ao vivo</button></div>`;
      $('#rv-build').onclick = e => act(e.target, async () => { rv = await api('POST', `/projects/${id}/review/build`); await mount(); });
      return;
    }
    stage.innerHTML = rv.mode === 'video'
      ? `<video playsinline preload="auto" src="/projects/${id}/files/preview.mp4?v=${Date.now()}"></video><div class="rv-hit"></div><div id="rv-pins"></div>`
      : `<hyperframes-player src="/projects/${id}/live/index.html?v=${Date.now()}" runtime-src="/hf/hyperframe.runtime.iife.js"></hyperframes-player><div class="rv-hit"></div><div id="rv-pins"></div>`;
    if (rv.mode === 'live') await loadHfPlayer();
    const el = stage.firstElementChild;
    // both expose the <video> API (play, pause, currentTime, duration, playbackRate); wait until the duration is known
    for (let i = 0; i < 300 && !(el.duration > 0 && (rv.mode === 'video' || el.ready)); i++) await new Promise(r => setTimeout(r, 100));
    if (!(el.duration > 0)) { stage.insertAdjacentHTML('beforeend', '<div class="rv-msg">O vídeo não carregou. Recarregue a página.</div>'); return; }
    P = el;
    P.playbackRate = rate;
    if (keepT) seek(keepT);
    stage.querySelector('.rv-hit').onclick = onStageClick;
    markKey = pinKey = '';
  }

  function onStageClick(e) {
    if (!P) return;
    if (pinning) {
      const r = stage.getBoundingClientRect();
      P.pause();
      draft = { t: now(), x: Math.round((e.clientX - r.left) / r.width * 1000) / 10, y: Math.round((e.clientY - r.top) / r.height * 1000) / 10 };
      pinning = false; paintCompose(); text.focus();
      return;
    }
    P.paused ? P.play() : P.pause();
  }

  // runs every frame while the screen is open: time code, scrubber, pins of the notes at this moment
  function paint() {
    const t = now(), d = dur();
    $('#rv-tc').innerHTML = `${tcode(t)} <small>/ ${tcode(d)}</small>`;
    const pct = d ? t / d * 100 : 0;
    scrub.querySelector('.fill').style.width = pct + '%';
    scrub.querySelector('.knob').style.left = pct + '%';
    $('#rv-play').textContent = P && !P.paused ? '❚❚' : '▶';
    if (!draft) $('#rv-at').textContent = tcode(t);   // with a draft, paintCompose owns the chip
    const mk = d + '|' + rv.notes.map(n => n.t + n.status + (n.end ?? '')).join();
    if (mk !== markKey) {
      markKey = mk;
      $('#rv-marks').innerHTML = d ? rv.notes.map(n => (n.end != null ? `<span class="rg ${n.status}" style="left:${n.t / d * 100}%;width:${(n.end - n.t) / d * 100}%"></span>` : '') + `<span class="mk ${n.status}" style="left:${n.t / d * 100}%" title="#${numOf(n)} ${esc(n.text.slice(0, 60))}"></span>`).join('') : '';
    }
    const pins = sorted().filter(n => n.x !== undefined && n.x !== null && (n.id === selId || (t > n.t - 0.75 && t < (n.end ?? n.t) + 0.75)));
    const pk = pins.map(n => n.id).join() + (draft?.x ?? '') + (draft?.y ?? '');
    if (pk !== pinKey && $('#rv-pins')) {
      pinKey = pk;
      $('#rv-pins').innerHTML = pins.map(n => `<span class="rv-pin" style="left:${n.x}%;top:${n.y}%">${numOf(n)}</span>`).join('') +
        (draft?.x !== undefined ? `<span class="rv-pin draft" style="left:${draft.x}%;top:${draft.y}%">+</span>` : '');
    }
  }
  (function loop() { if (!alive()) return; paint(); requestAnimationFrame(loop); })();

  function paintCompose() {
    $('#rv-pin').classList.toggle('on', pinning || draft?.x !== undefined);
    $('#rv-pin').textContent = pinning ? '📍 Clique no vídeo...' : draft?.x !== undefined ? '📍 Ponto marcado ✕' : '📍 Marcar ponto';
    stage.querySelector('.rv-hit')?.classList.toggle('pinning', pinning);
    if (draft) $('#rv-at').textContent = span(draft);
    $('#rv-out').classList.toggle('on', draft?.end != null);
    $('#rv-out').textContent = draft?.end != null ? 'Fim ⇥ ✕' : 'Fim ⇥';
  }

  function renderNotes() {
    const list = sorted().filter(n => filter === 'all' || n.status === 'open');
    const open = openCount();
    $('#rv-count').textContent = `${open} aberta${open === 1 ? '' : 's'} · ${rv.notes.length} no total${rv.round ? ` · rodada ${rv.round}` : ''}`;
    body.querySelectorAll('.rv-notes-head .tabs button').forEach(b => b.classList.toggle('on', b.dataset.f === filter));
    $('#rv-list').innerHTML = list.length ? list.map(n => `<div class="rv-note ${n.id === selId ? 'cur' : ''}" data-id="${n.id}">
        <div class="rv-note-top"><b>#${numOf(n)}</b><span class="chip">${span(n)}</span>${n.x !== undefined && n.x !== null ? '<span title="Ponto marcado no quadro">📍</span>' : ''}
          <span class="st ${n.status}">${RV_STATUS[n.status]}${n.round ? ` · rodada ${n.round}` : ''}</span></div>
        <p>${esc(n.text)}</p>
        ${n.reply ? `<div class="reply">Claude: ${esc(n.reply)}</div>` : ''}
        <div class="acts">${applying ? '' : `<button data-act="edit">${n.status === 'open' ? 'Editar' : 'Refazer'}</button><button data-act="del">Remover</button>`}</div>
      </div>`).join('')
      : `<p class="muted" style="padding:10px;font-size:12px">${rv.notes.length ? 'Nenhuma anotação aberta.' : 'Nenhuma anotação ainda. Pause o vídeo no ponto que quer mudar e escreva abaixo.'}</p>`;
    const send = $('#rv-send');
    send.disabled = applying || !open;
    send.innerHTML = applying ? '<span class="step-spinner" style="width:13px;height:13px;border-width:2px;border-top-color:var(--ink);border-color:rgba(0,0,0,0.25);margin-right:6px"></span> Claude aplicando...'
      : open ? `Enviar ${open} alteraç${open === 1 ? 'ão' : 'ões'} para o Claude` : 'Nenhuma anotação aberta';
    $('#rv-final').disabled = applying || !!open;
    $('#rv-final').title = open ? 'Envie as anotações abertas para o Claude ou remova antes de aprovar' : '';
    for (const b of [text, $('#rv-add'), $('#rv-pin'), $('#rv-in'), $('#rv-out')]) b.disabled = applying;
  }

  const save = async () => { rv = await api('PUT', `/projects/${id}/review`, { notes: rv.notes }); renderNotes(); };

  async function addNote() {
    const msg = text.value.trim();
    if (!msg) return;
    const t = draft?.t ?? now();
    rv.notes.push({ id: 'n' + Date.now().toString(36), t: Math.round(t * 1000) / 1000, ...(draft?.end != null ? { end: Math.round(draft.end * 1000) / 1000 } : {}), ...(draft?.x !== undefined ? { x: draft.x, y: draft.y } : {}), text: msg, status: 'open' });
    text.value = ''; draft = null; pinning = false; paintCompose();
    await save();
  }

  $('#rv-list').onclick = e => {
    const el = e.target.closest('.rv-note'); if (!el) return;
    const n = rv.notes.find(x => x.id === el.dataset.id); if (!n) return;
    const a = e.target.closest('button')?.dataset.act;
    if (a === 'del') { rv.notes = rv.notes.filter(x => x !== n); if (selId === n.id) selId = null; save().catch(err => alert(err.message)); return; }
    if (a === 'edit') {   // back to the composer, same time and spot; it becomes a new note when added again
      rv.notes = rv.notes.filter(x => x !== n);
      text.value = n.text; draft = { t: n.t, ...(n.end != null ? { end: n.end } : {}), ...(n.x !== undefined && n.x !== null ? { x: n.x, y: n.y } : {}) };
      seek(n.t); P?.pause(); paintCompose(); text.focus();
      save().catch(err => alert(err.message));
      return;
    }
    selId = n.id; P?.pause(); seek(n.t); pinKey = ''; renderNotes();
  };
  body.querySelectorAll('.rv-notes-head .tabs button').forEach(b => b.onclick = () => { filter = b.dataset.f; renderNotes(); });
  body.querySelectorAll('.rv-speeds button').forEach(b => {
    b.classList.toggle('on', Number(b.dataset.s) === rate);
    b.onclick = () => {
      rate = Number(b.dataset.s); if (P) P.playbackRate = rate;
      try { localStorage.setItem('rv_rate', String(rate)); } catch {}
      body.querySelectorAll('.rv-speeds button').forEach(x => x.classList.toggle('on', x === b));
    };
  });
  $('#rv-play').onclick = () => P && (P.paused ? P.play() : P.pause());
  $('#rv-back').onclick = () => { P?.pause(); seek(now() - 1 / RV_FPS); };
  $('#rv-fwd').onclick = () => { P?.pause(); seek(now() + 1 / RV_FPS); };
  scrub.onpointerdown = e => {
    if (!P) return;
    const to = ev => { const r = scrub.getBoundingClientRect(); seek(Math.max(0, Math.min(1, (ev.clientX - r.left) / r.width)) * dur()); };
    scrub.setPointerCapture(e.pointerId); to(e);
    scrub.onpointermove = to;
    scrub.onpointerup = () => { scrub.onpointermove = null; };
  };
  // writing a note freezes its time where the video was paused
  text.onfocus = () => { if (!draft && P) { P.pause(); draft = { t: now() }; paintCompose(); } };
  text.onkeydown = e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); addNote().catch(err => alert(err.message)); } };
  text.oninput = () => { if (!text.value && draft && draft.x === undefined && draft.end == null) draft = null; };
  $('#rv-add').onclick = e => act(e.target, addNote);
  // I/O like Premiere: Início moves the start to the playhead, Fim sets the end there (again to drop the range)
  const markIn = () => { P?.pause(); draft = { ...(draft ?? {}), t: now() }; if (draft.end <= draft.t) delete draft.end; pinKey = ''; paintCompose(); };
  const markOut = () => {
    P?.pause();
    if (draft?.end != null) delete draft.end;
    else { draft ??= { t: now() }; if (now() > draft.t) draft.end = now(); }
    paintCompose();
  };
  $('#rv-in').onclick = markIn; $('#rv-out').onclick = markOut;
  $('#rv-pin').onclick = () => {
    if (draft?.x !== undefined) { delete draft.x; delete draft.y; pinning = false; }
    else { pinning = !pinning; if (pinning) P?.pause(); }
    pinKey = ''; paintCompose();
  };

  const onKey = e => {
    if (!alive()) return document.removeEventListener('keydown', onKey);
    if (!P || e.target.closest?.('input, textarea, select, [contenteditable]')) return;
    if (e.code === 'Space') { e.preventDefault(); P.paused ? P.play() : P.pause(); }
    else if (e.key === 'i' || e.key === 'o') (e.key === 'i' ? markIn : markOut)();
    else if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') {
      e.preventDefault(); P.pause();
      seek(now() + (e.key === 'ArrowRight' ? 1 : -1) * (e.shiftKey ? 1 : 1 / RV_FPS));
    }
  };
  document.addEventListener('keydown', onKey);

  $('#rv-send').onclick = e => act(e.target, async () => {
    if (text.value.trim()) await addNote();   // a note still in the box goes in this round too
    const t = now(), n = openCount();
    P?.pause(); applying = true; renderNotes();
    $('#rv-status').textContent = `Claude aplicando ${n} anotaç${n === 1 ? 'ão' : 'ões'} com a sua conta... pode levar alguns minutos.`;
    try {
      const res = await api('POST', `/projects/${id}/review/apply`);
      rv = res;
      $('#rv-status').innerHTML = `<span style="color:var(--green);font-weight:600">✓ Rodada ${rv.round} aplicada. Assista de novo e anote o que faltar.</span>` +
        (res.warnings?.length ? `<br><span style="color:var(--red)">Alguns cards inválidos foram descartados: ${esc(res.warnings.join('; ').slice(0, 300))}</span>` : '');
    } catch (err) {
      $('#rv-status').innerHTML = `<span style="color:var(--red)">Erro: ${esc(err.message)}. As anotações continuam abertas.</span>`;
      throw err;
    } finally {
      applying = false;
      if (alive()) { renderNotes(); await mount(t); }
    }
  });

  $('#rv-final').onclick = () => { P?.pause(); window.switchProjectStep('edit'); };

  renderNotes(); paintCompose();
  await mount();
}

// Step 4: delivery of the approved video. The final render (formats + QA), the After Effects export and the hook copy.
// Step 4: Edição. Premiere-like layers on top of the AI composition: the monitor is the live player, every change is saved
// to layers.json, which the server applies to the composition's index.html (the final render uses that file too).
// Position/scale/rotation/opacity/volume show at once in the player; timing, texts and new layers reload it.
const ED_KIND = {
  video: ['Vídeo original', '#2f6fb3'], plate: ['Vídeo original (fundo)', '#2f6fb3'], cutout: ['Vídeo recortado', '#5a4fcf'], scene: ['Cenas', '#a33d72'], title: ['Títulos', '#b08f00'],
  card: ['Cards', '#a33d72'], caption: ['Legenda', '#3c8c5a'], voice: ['Voz', '#2b7f7f'], sfx: ['SFX', '#4f8f3a'], audio: ['Áudio', '#2b7f7f'], element: ['Elemento', '#5d6058'],
  'add:text': ['Texto', '#c47a1f'], 'add:title': ['Título dinâmico', '#c9a400'], 'add:captions': ['Legenda simples', '#3c8c5a'], 'add:image': ['Imagem', '#7d52c0'],
  'add:video': ['Vídeo', '#2f6fb3'], 'add:audio': ['Trilha sonora', '#2e8b5a'], 'add:model': ['3D', '#c0502f'],
};
const ED_AUDIO = new Set(['voice', 'sfx', 'audio', 'add:audio']);
const ED_TOOLS = [['select', 'V', '➤', 'Selecionar e mover (V)', 'Selecionar'], ['razor', 'C', '✂', 'Cortar (C): clique no clipe para dividir', 'Cortar'],
  ['rate', 'R', '↔', 'Tempo de tela (R): arraste no clipe para aumentar ou reduzir a duração', 'Duração'], ['text', 'T', 'T', 'Texto (T): clique no vídeo para criar um texto', 'Texto'],
  ['crop', 'X', '⧉', 'Cortar o objeto (X): arraste as bordas da seleção no vídeo para esconder partes da camada', 'Recorte'],
  ['layers', 'L', '☰', 'Camadas (L): trazer para frente ou enviar para trás, como no Canva', 'Camadas']];

async function editStep(id, body, st) {
  let data = await api('GET', `/projects/${id}/layers`);
  let E = data.edits;
  let P = null, tool = 'select', sel = null, pps = 0, hist = [], fut = [], drag = null, saveT = null, needReload = false, saving = Promise.resolve();

  body.innerHTML = `<div class="box"><h3>Etapa 4: edição</h3>
    <p class="muted" style="margin-top:0">Camadas sobre o vídeo da IA, como no Premiere. Tudo salva sozinho e vale para o render final; pedir outra rodada à IA na Revisão mantém as edições (camadas que a IA apagar perdem as delas, com aviso).</p>
    <div class="ed-grid" id="ed-grid">
      <div class="ed-tools" id="ed-tools">
        ${ED_TOOLS.map(([k, key, ic, tt, lb]) => `<button data-tool="${k}" data-k="${lb} · ${key}" title="${tt}">${ic}<small>${lb}</small></button>`).join('')}
        <hr>
        <button id="ed-add-media" data-k="Importar" title="Importar imagem, vídeo, trilha, SFX ou modelo 3D (.glb)">＋<small>Importar</small></button>
        <button id="ed-add-title" data-k="Título dinâmico" title="Título dinâmico (animado) no ponto atual">Tt<small>Título</small></button>
        <button id="ed-add-caps" data-k="Legenda simples" title="Legenda simples a partir da transcrição">CC<small>Legenda</small></button>
        <hr>
        <button id="ed-undo" data-k="Desfazer · ⌘Z" title="Desfazer (Cmd/Ctrl+Z)">↶<small>Desfazer</small></button>
        <button id="ed-redo" data-k="Refazer · ⇧⌘Z" title="Refazer (Shift+Cmd/Ctrl+Z)">↷<small>Refazer</small></button>
        <input type="file" id="ed-file" multiple hidden accept="image/*,video/*,audio/*,.glb">
      </div>
      <div class="ed-mon">
        <div class="ed-stage" id="ed-stage"></div>
        <div class="rv-bar">
          <button id="ed-play" title="Play / pausa (espaço)">▶</button>
          <button id="ed-back" title="Voltar 1 quadro (←)">◀︎|</button>
          <button id="ed-fwd" title="Avançar 1 quadro (→)">|▶︎</button>
          <span class="rv-tc" id="ed-tc">00:00:00:00</span>
          <label title="Tamanho do preview">Tamanho <input type="range" id="ed-size" min="25" max="90"></label>
          <button id="ed-layout" title="Monitor à esquerda: mais espaço para a timeline e o inspetor">⇤ Monitor à esquerda</button>
        </div>
      </div>
      <div class="ed-insp" id="ed-insp"></div>
    <div class="ed-tl" id="ed-tl">
      <div class="ed-tl-bar">
        <span class="muted" style="font-size:11px">Arraste o corpo para mover, as bordas para aparar, o nome da trilha para mudar a ordem · Backspace liga ou desliga a camada (ou o trecho) selecionada · solte arquivos aqui para importar</span>
        <label class="muted" style="font-size:11px;margin-left:auto;display:flex;gap:6px;align-items:center">Zoom <input type="range" id="ed-zoom" min="0" max="100" value="0" style="width:110px;padding:0"></label>
      </div>
      <div class="ed-tl-body"><div class="ed-heads" id="ed-heads"></div><div class="ed-lanes" id="ed-lanes"><div class="ed-lanes-in" id="ed-in"></div></div></div>
    </div>
    </div>
    <div class="ed-foot">
      <span class="muted" id="ed-status" style="font-size:12px"></span>
      <span class="err" id="ed-warn" style="font-size:12px"></span>
      <button id="ed-to-rv">⬅ Revisão (Etapa 3)</button>
      <button class="primary" id="ed-next" style="margin-left:auto">Ir para a Entrega (Etapa 5) ➔</button>
    </div>
  </div>`;

  const stage = $('#ed-stage'), lanes = $('#ed-lanes'), inner = $('#ed-in');
  const alive = () => document.contains(stage);
  const now = () => P?.currentTime || 0;
  const dur = () => data.duration || P?.duration || 1;
  const seek = t => { if (P) { t = Math.max(0, Math.min(dur(), t)); P.seek ? P.seek(t) : (P.currentTime = t); } };
  const r2 = n => Math.round(n * 1000) / 1000;
  const status = t => { $('#ed-status').textContent = t; };
  const warn = () => { $('#ed-warn').textContent = (data.warnings || []).join(' · '); };
  const ed = id => E.layers[id] ??= {};
  const added = id => E.added.find(a => a.id === id);

  // ---- the layers: the AI's (with their edits) and the added ones, grouped into tracks like Premiere ----
  function items() {
    const list = [
      ...data.layers.map(l => {
        const e = E.layers[l.id] || {}, s = e.start ?? l.start, d = e.duration ?? (l.end - l.start);
        return { id: l.id, kind: l.kind, ai: true, clip: l.clip, start: s, end: s + d, row: 't' + l.track, track: l.track, texts: l.texts, colors: l.colors, media: ['video', 'plate', 'cutout', 'voice', 'sfx', 'audio'].includes(l.kind), comp: l.comp };
      }),
      ...E.added.map(a => ({ id: a.id, kind: 'add:' + a.kind, ai: false, clip: true, start: a.start, end: a.start + a.duration, row: (a.kind === 'audio' ? 'aa' : 'av') + a.track, track: a.track, a, lic: a.rights?.status === 'unlicensed', media: a.kind === 'video' || a.kind === 'audio' })),
    ];
    list.forEach(i => { const r = E.layers[i.id]?.row; if (r && !ED_AUDIO.has(i.kind) && i.kind !== 'add:audio') i.row = r; });   // a layer moved to another track in Camadas
    // sound effects (the AI's and short added sounds) share at most 2 tracks, overlapping ones go to the emptier one
    const ends = [0, 0];
    list.filter(i => i.kind === 'sfx' || (i.kind === 'add:audio' && i.end - i.start <= 10)).sort((a, b) => a.start - b.start).forEach(i => {
      let k = ends.findIndex(e => e <= i.start + 1e-3);
      if (k < 0) k = ends[0] <= ends[1] ? 0 : 1;
      ends[k] = Math.max(ends[k], i.end); Object.assign(i, { row: 'sfx' + k, track: 100 + k, sfx: true });
    });
    return list;
  }
  const item = id => items().find(i => i.id === id);
  const isVisualRow = key => !key.startsWith('sfx') && !key.startsWith('aa') && !ED_AUDIO.has(items().find(i => i.row === key)?.kind);
  function rows() {
    const m = new Map();
    for (const it of items()) { if (!m.has(it.row)) m.set(it.row, []); m.get(it.row).push(it); }
    const key = ([, l]) => { const it = l[0], a = ED_AUDIO.has(it.kind); return [a ? 1 : 0, a ? (it.ai ? 0 : 1) : (it.ai ? 1 : 0), a ? it.track : -it.track]; };
    const def = [...m].sort((x, y) => { const a = key(x), b = key(y); return a[0] - b[0] || a[1] - b[1] || a[2] - b[2]; });
    if (!E.order?.length) return def;
    // the order the user dragged the picture tracks into; a track that is not in it yet (a new layer) goes on top
    const rank = ([k], i) => ED_AUDIO.has(m.get(k)[0].kind) ? 1e6 + i : E.order.includes(k) ? E.order.indexOf(k) : -1e3 + i;
    return def.map((r, i) => [r, rank(r, i)]).sort((a, b) => a[1] - b[1]).map(([r]) => r);
  }
  // an AI layer split by the razor and with stretches cut out (gaps); an added layer is one block
  function segs(it) {
    if (!it.ai) return [{ a: it.start, b: it.end, off: false }];
    const e = E.layers[it.id] || {};
    const pts = [it.start, ...[...new Set(e.cuts || [])].filter(c => c > it.start + 0.01 && c < it.end - 0.01).sort((a, b) => a - b), it.end];
    return pts.slice(1).map((b, i) => ({ a: pts[i], b, off: (e.gaps || []).some(g => g[0] <= pts[i] + 1e-3 && g[1] >= b - 1e-3) }));
  }
  const addGap = (e, a, b) => {
    const out = [];
    for (const g of [...(e.gaps || []), [a, b]].sort((x, y) => x[0] - y[0])) { const l = out[out.length - 1]; if (l && g[0] <= l[1] + 1e-3) l[1] = Math.max(l[1], g[1]); else out.push([...g]); }
    e.gaps = out.map(g => [r2(g[0]), r2(g[1])]);
  };
  const subGap = (e, a, b) => { e.gaps = (e.gaps || []).flatMap(([s, t]) => t <= a || s >= b ? [[s, t]] : [...(s < a ? [[s, a]] : []), ...(t > b ? [[b, t]] : [])]); };
  const addCut = (e, t) => { e.cuts = [...new Set([...(e.cuts || []), r2(t)])].sort((a, b) => a - b); };
  const isHidden = it => !!E.layers[it.id]?.hidden;
  const label = it => it.a ? (it.a.name || it.a.text || ED_KIND[it.kind][0]).slice(0, 40) : (it.texts?.[0]?.text || it.id);

  // ---- history and saving ----
  const snap = () => { hist.push(JSON.stringify(E)); if (hist.length > 100) hist.shift(); fut = []; };
  // text style: B / I / weight / size / family, for the AI's text (layer font) and for added text (its own fields)
  function fontRow(o, ai) {
    const fams = [...new Set([...(() => { try { return [...doc().fonts].map(f => f.family.replace(/["']/g, '')); } catch { return []; } })(), 'Georgia', 'Impact', 'Arial Black', 'Helvetica Neue', 'Courier New'])];
    if (o.family && !fams.includes(o.family)) fams.push(o.family);
    const w = o.weight ?? (ai ? 0 : 800);
    return `<div class="fontrow"><button data-ft="bold" class="${w >= 700 ? 'on' : ''}" title="Negrito"><b>B</b></button><button data-ft="italic" class="${o.italic ? 'on' : ''}" title="Itálico"><i>I</i></button>
      <select data-ft="weight" title="Peso">${ai ? '<option value="">Peso</option>' : ''}${[100, 300, 400, 500, 600, 700, 800, 900].map(x => `<option ${x === w ? 'selected' : ''}>${x}</option>`).join('')}</select>
      <input type="number" data-ft="size" min="8" max="600" style="width:54px" placeholder="Tam." title="Tamanho (px)" value="${o.size ?? (ai ? '' : 96)}">
      <select data-ft="family" title="Fonte"><option value="">${ai ? 'Fonte original' : 'Fonte padrão'}</option>${fams.map(f => `<option ${f === o.family ? 'selected' : ''}>${esc(f)}</option>`).join('')}</select></div>`;
  }
  function change(reload, fn) { snap(); fn(); save(reload); paintTl(); paintInsp(); }
  function save(reload) {
    needReload ||= reload;
    clearTimeout(saveT); status('salvando…');
    saveT = setTimeout(() => { saving = saving.then(flush); }, 450);
  }
  async function flush() {
    const reload = needReload; needReload = false;
    try {
      const out = await api('PUT', `/projects/${id}/layers`, E);
      data.layers = out.layers; data.warnings = out.warnings; warn();
      status('salvo ✓');
      if (reload && alive()) await mount(now());
    } catch (e) { status('erro ao salvar: ' + e.message); }
  }
  function undo(redo) {
    const from = redo ? fut : hist, to = redo ? hist : fut;
    if (!from.length) return;
    to.push(JSON.stringify(E)); E = JSON.parse(from.pop());
    save(true); paintTl(); paintInsp();
  }

  // ---- the monitor ----
  async function mount(keepT = 0) {
    P = null;
    stage.innerHTML = `<hyperframes-player src="/projects/${id}/live/index.html?v=${Date.now()}" runtime-src="/hf/hyperframe.runtime.iife.js"></hyperframes-player><div class="ed-hit" id="ed-hit"></div>` +
      `<div class="ed-box" id="ed-box">${[['nw', 0, 0], ['n', 50, 0], ['ne', 100, 0], ['e', 100, 50], ['se', 100, 100], ['s', 50, 100], ['sw', 0, 100], ['w', 0, 50]].map(([h, x, y]) => `<i data-h="${h}" style="left:${x}%;top:${y}%"></i>`).join('')}</div>`;

    ${sec('1 · FORMATOS DE RENDER', st.composed ? `Reel composto pelo agente: cada formato tem a sua composição (o agente recompõe o quadro). Formato principal: ${esc(st.primaryFormat || '9:16')}.` : 'Full HD, com áudio masterizado e QA automático. Um arquivo por formato.', `
      <div id="fmts" class="fmt-selector-group">${fmtBoxes(st.formats)}</div>

        <details><summary>Relatório</summary><pre>${esc(st.qa.report)}</pre></details>
        ${((st.readyFinals && st.readyFinals.length > 0) ? st.readyFinals : (st.formats || []).filter(f => f === (st.primaryFormat || '9:16'))).map(f => `<p style="font-weight:600;margin-top:16px">${esc(f)}</p><video controls src="/projects/${id}/files/final-${f.replace(':', '-')}.mp4?${Date.now()}"></video>`).join('')}</div>` : ''}`)}

    ${sec('4 · STATUS & ENCERRAMENTO DO PROJETO', 'Finalize o ciclo deste vídeo marcando-o como concluído para arquivá-lo na esteira e retirar os alertas de ação pendente.', `

    if (!container) return;

    const primary = st.primaryFormat || '9:16';
    const composedFmts = st.composedFormats || [primary];
    const missing = chosen.filter(f => f !== primary && !composedFmts.includes(f));

    if (missing.length === 0) {
      container.innerHTML = `<div style="display:flex;align-items:center;gap:8px;font-size:12px;color:#00e676;background:rgba(0,230,118,0.08);border:1px solid rgba(0,230,118,0.25);border-radius:8px;padding:8px 12px">

          <p style="margin:0 0 6px 0;font-size:12px;font-weight:700;color:#ffb600">

          </div>
        </div>`;

      container.querySelectorAll('[data-compose-fmt]').forEach(b => {
        b.onclick = () => {
          const f = b.dataset.composeFmt;
          window.setProjectRunning({ step: 'motion', startedAt: Date.now() });
          window.renderProject();
          api('POST', `/projects/${id}/compose`, { format: f }).then(() => {
            window.setProjectRunning(null);
            window.renderProject();

  const fmtsGroup = $('#fmts');
  if (fmtsGroup) {
    fmtsGroup.addEventListener('change', updateAgentFormatsUI);
  }
  updateAgentFormatsUI();

  $('#dl-back').onclick = () => window.switchProjectStep('edit');

  }

    const fmts = picked($('#fmts'));

    api('POST', `/projects/${id}/final`, { formats: fmts }).catch(err => {
      window.setProjectRunning(null);
      alert('Erro ao renderizar o final: ' + err.message);
      window.renderProject();
    });
  });
  $('#dl-ae').onclick = e => act(e.target, async () => {
    const r = await api('POST', `/projects/${id}/ae`);
    alert(r.aepGenerated ? '✓ Projeto do After Effects (.aep) criado em:\n' + r.aep
      : '✓ Scripts (.jsx) e clipes exportados.\nPara gerar o .aep, abra o After Effects e rode o script:\n' + (r.outputDir || '') + '/run.jsx');
  });
  $('#dl-hooks').onclick = e => act(e.target, async () => {
    const r = await api('POST', `/projects/${id}/embrulhos`);
    $('#dl-hook-list').innerHTML = hookList(r.embrulhos || []);
  });
}

// Funções globais de exportação e exclusão de formatos
function exportFormat(f) {
  if (!f || !f.id) return;
  const jsonStr = JSON.stringify(f, null, 2);
  const blob = new Blob([jsonStr], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `formato-${f.id}.json`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

async function deleteFormatConfirm(id, name) {
  const displayName = name || id;
  const msg = `Tem certeza que deseja excluir o formato "${displayName}"?\n\nEsta ação apagará permanentemente o formato do disco e não poderá ser desfeita.`;
  if (!confirm(msg)) return;
  try {
    await api('DELETE', `/formats/${id}`);
    alert(`Formato "${displayName}" excluído com sucesso!`);
    const host = $('#fmtModalHost');
    if (host) host.innerHTML = '';
    formats();
  } catch (err) {
    alert(`Erro ao excluir formato: ${err.message || err}`);
  }
}

async function formats() {
  const ids = await api("GET", "/formats");
  // Carrega detalhes de cada formato
  const allFormats = await Promise.all(ids.map(id => api("GET", `/formats/${id}`).catch(() => null)));
  // Filtra e prioriza os 10 estilos principais na ordem selecionada
  const ORDER = [
    'business-reels',
    'personal-reels',
    'split-reel',
    'fitted-captions',
    'image-cluster',
    'cutout-backdrop',
    'ranking-format',
    'explainer-panel'
  ];

  const validFormats = allFormats.filter(f => f && f.id);
  // Ordena conforme a lista especificada, mantendo os 10 primeiros na ordem e outros criados pelo usuário a seguir
  validFormats.sort((a, b) => {
    const idxA = ORDER.indexOf(a.id);
    const idxB = ORDER.indexOf(b.id);
    if (idxA !== -1 && idxB !== -1) return idxA - idxB;
    if (idxA !== -1) return -1;
    if (idxB !== -1) return 1;
    return (a.order ?? 999) - (b.order ?? 999);
  });

  // Filtra para exibição principal dos estilos (ocultando perfis puramente de dimensão técnica se existirem no workspace)
  const displayFormats = validFormats;   // every format folder: a hidden one could not be picked for editing

  app.innerHTML = `
    <div class="fmt-gallery-wrap">
      <div class="fmt-gallery-head">
        <div>
          <h2 class="fmt-gallery-title">
            Formatos
            <span class="fmt-gallery-count">${displayFormats.length} estilos</span>

              <button type="button" class="fmt-quick-btn export" data-fmt-id="${esc(f.id)}" title="Exportar formato (JSON)">📥</button>
              <button type="button" class="fmt-quick-btn delete" data-fmt-id="${esc(f.id)}" data-fmt-name="${esc(f.name || f.id)}" title="Excluir formato">🗑️</button>

            <div class="fmt-thumb-frame">
              ${renderStyleAnim(f.id)}

              <div class="fmt-card-row">
                <h4 class="fmt-card-name">${esc(f.name || f.id)}</h4>
                <div class="fmt-card-tags">
                  <span class="badge-fmt">${esc(f.aspectRatio || "9:16")}</span>
                  ${f.cutout ? `<span class="badge-cutout">✂ Cut-out</span>` : ''}
                </div>
              </div>
              <p class="fmt-card-desc">${esc(f.description || "Estilo dinâmico com cortes e legendas cinéticas.")}</p>
            </div>
          </article>
        `).join('')}
      </div>
    </div>
    <div id="fmtModalHost"></div>
  `;

  $('#fmtCloneBtn').onclick = () => openCloneModal();

  // Importar formato .json
  $('#fmtImportBtn').onclick = () => $('#fmtImportFile').click();
  $('#fmtImportFile').onchange = async e => {
    const file = e.target.files[0];
    if (!file) return;
    try {
      const text = await file.text();
      const parsed = JSON.parse(text);
      let id = parsed.id || file.name.replace(/\.json$/i, '').replace(/[^a-z0-9_-]/gi, '-').toLowerCase();
      if (!id) id = 'novo-formato';
      
      const chosenId = prompt('Identificador (ID) para o formato importado:', id);
      if (!chosenId) return;
      const cleanId = chosenId.trim().toLowerCase().replace(/[^a-z0-9_-]/g, '-');
      if (!cleanId) return alert('ID inválido');
      parsed.id = cleanId;
      if (!parsed.name) parsed.name = cleanId;

      await api('POST', '/formats', { id: cleanId, format: parsed });
      alert(`Formato "${cleanId}" importado com sucesso!`);
      formats();
    } catch (err) {
      alert(`Erro ao importar formato: ${err.message || err}`);
    } finally {
      e.target.value = '';
    }
  };

  // Ações rápidas nos cards (Exportar e Excluir)
  app.querySelectorAll('.fmt-quick-btn.export').forEach(btn => {
    btn.onclick = async e => {
      e.stopPropagation();
      const id = btn.dataset.fmtId;
      const f = await api('GET', `/formats/${id}`);
      exportFormat(f);
    };
  });

  app.querySelectorAll('.fmt-quick-btn.delete').forEach(btn => {
    btn.onclick = async e => {
      e.stopPropagation();
      const id = btn.dataset.fmtId;
      const name = btn.dataset.fmtName;
      await deleteFormatConfirm(id, name);
    };
  });

  // Clique nos cards abre o modal de detalhes e comentários
  app.querySelectorAll('.fmt-style-card').forEach(card => {
    card.onclick = () => openFormatModal(card.dataset.fmtId);
  });
}

// Clonar animação: vídeos (link ou arquivo) + imagens de referência -> novo formato escrito pelo Opus

  const VIDEO_EXTS = ['.mp4', '.mov', '.m4v'];
  const IMAGE_EXTS = ['.png', '.jpg', '.jpeg', '.webp'];

  let filesList = [];
  let urlsList = [];

  function formatBytes(bytes) {
    if (!bytes || bytes === 0) return '0 B';
    const k = 1024, sizes = ['B', 'KB', 'MB', 'GB'];
    const i = Math.floor(Math.log(bytes) / Math.log(k));
    return parseFloat((bytes / Math.pow(k, i)).toFixed(1)) + ' ' + sizes[i];
  }

  function getExt(name) {
    const dot = name.lastIndexOf('.');
    return dot >= 0 ? name.slice(dot).toLowerCase() : '';
  }

  function isVideo(name) {
    return VIDEO_EXTS.includes(getExt(name));
  }

  function sanitizeSlug(val) {
    return val.toLowerCase().replace(/[^a-z0-9_-]/g, '-').replace(/-+/g, '-');
  }

            <div id="cloneSummaryPills" style="display:flex;align-items:center;gap:6px;flex-wrap:wrap">

          <!-- Mensagem de Erro -->
          <div id="cloneErrorBox" style="display:none;background:rgba(239,68,68,0.12);border:1px solid rgba(239,68,68,0.3);border-radius:8px;padding:9px 12px;font-size:12px;color:#fca5a5"></div>

          <!-- Botões de Ação -->

            <button type="button" id="cloneGo" class="primary" style="flex:2;padding:11px;font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px;background:linear-gradient(135deg, #f7b708 0%, #ebac00 100%);color:#000;border:none;border-radius:9px;cursor:pointer;box-shadow:0 3px 14px rgba(247,183,8,0.28)">
              ✨ Analisar e Criar Formato com Opus
            </button>
          </div>
        </div>

        <!-- Tela de Carregamento (Oculta até o submit) -->
        <div id="cloneLoadingView" style="display:none;padding:40px 28px;text-align:center;flex-direction:column;align-items:center;justify-content:center;gap:18px">

  const close = () => { host.innerHTML = ''; };
  $('#cloneClose').onclick = close;
  $('#cloneBtnCancel').onclick = close;
  $('#cloneOverlay').onclick = e => { if (e.target.id === 'cloneOverlay') close(); };

  // Tecla Escape para fechar
  const escHandler = e => {
    if (e.key === 'Escape' && $('#cloneOverlay') && $('#cloneLoadingView').style.display !== 'flex') {
      close();
      window.removeEventListener('keydown', escHandler);
    }
  };
  window.addEventListener('keydown', escHandler);

  // Tabs
  function setTab(tab) {
    activeTab = tab;
    $('#tabBtnFiles').classList.toggle('active', tab === 'files');
    $('#tabBtnUrls').classList.toggle('active', tab === 'urls');
    $('#tabBtnSkill').classList.toggle('active', tab === 'skill');

    $('#paneFiles').style.display = tab === 'files' ? 'flex' : 'none';
    $('#paneUrls').style.display = tab === 'urls' ? 'flex' : 'none';
    $('#paneSkill').style.display = tab === 'skill' ? 'flex' : 'none';
  }
  $('#tabBtnFiles').onclick = () => setTab('files');
  $('#tabBtnUrls').onclick = () => setTab('urls');
  $('#tabBtnSkill').onclick = () => setTab('skill');

  // Input ID - sanitização em tempo real
  $('#cloneId').oninput = e => {
    const raw = e.target.value;
    const clean = raw.toLowerCase().replace(/[^a-z0-9_.-]/g, '-');
    if (raw !== clean) e.target.value = clean;
  };

  // Gerenciamento de Arquivos
  const dropzone = $('#cloneDropzone');
  const fileInput = $('#cloneFilesInput');

  dropzone.onclick = () => fileInput.click();
  dropzone.ondragover = e => { e.preventDefault(); dropzone.classList.add('dragover'); };
  dropzone.ondragleave = () => dropzone.classList.remove('dragover');
  dropzone.ondrop = e => {
    e.preventDefault();
    dropzone.classList.remove('dragover');
    if (e.dataTransfer?.files?.length) addFiles(e.dataTransfer.files);
  };

  fileInput.onchange = e => {
    if (e.target.files?.length) addFiles(e.target.files);
    e.target.value = ''; // permite selecionar os mesmos arquivos se quiser
  };

  // Suporte a colar print da área de transferência
  $('#cloneOverlay').addEventListener('paste', e => {
    const items = (e.clipboardData || e.originalEvent?.clipboardData)?.items;
    if (!items) return;
    const pasted = [];
    for (const item of items) {
      if (item.kind === 'file') {
        const f = item.getAsFile();
        if (f) pasted.push(f);
      }
    }
    if (pasted.length) {
      addFiles(pasted);
      setTab('files');
    }
  });

  function addFiles(newFiles) {
    for (const f of newFiles) {
      const ext = getExt(f.name);
      if (!VIDEO_EXTS.includes(ext) && !IMAGE_EXTS.includes(ext)) {
        alert(`Arquivo "${f.name}" não suportado. Use vídeos (${VIDEO_EXTS.join(', ')}) ou imagens (${IMAGE_EXTS.join(', ')}).`);
        continue;
      }
      // Evita duplicata exata
      if (!filesList.some(item => item.name === f.name && item.size === f.size)) {
        filesList.push(f);
      }
    }
    renderFiles();
    updateSummary();
  }

  function removeFile(index) {
    filesList.splice(index, 1);
    renderFiles();
    updateSummary();
  }

  function renderFiles() {
    const list = $('#cloneFilesList');
    const badge = $('#badgeFilesCount');
    if (!filesList.length) {
      list.innerHTML = '';
      badge.style.display = 'none';
      return;
    }
    badge.style.display = 'inline-block';
    badge.textContent = String(filesList.length);

    list.innerHTML = filesList.map((f, i) => {
      const isVid = isVideo(f.name);
      return `
        <div class="clone-file-item">
          <div style="display:flex;align-items:center;gap:8px;min-width:0">
            <span style="font-size:16px">${isVid ? '🎬' : '🖼️'}</span>
            <span class="clone-file-badge ${isVid ? 'video' : 'image'}">${isVid ? 'Vídeo' : 'Imagem'}</span>
            <span style="font-weight:600;color:var(--cream);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:260px" title="${esc(f.name)}">${esc(f.name)}</span>
            <span class="muted" style="font-size:11px">(${formatBytes(f.size)})</span>
          </div>
          <button type="button" class="clone-del-btn" data-file-idx="${i}" title="Remover arquivo">&times;</button>
        </div>
      `;
    }).join('');

    list.querySelectorAll('.clone-del-btn').forEach(btn => {
      btn.onclick = () => removeFile(Number(btn.dataset.fileIdx));
    });
  }

  // Gerenciamento de URLs
  function addUrl(u) {
    const trimmed = String(u || '').trim();
    if (!trimmed) return;
    if (!/^https?:\/\//i.test(trimmed)) {
      return alert('Insira uma URL válida iniciando com http:// ou https://');
    }
    if (!urlsList.includes(trimmed)) {
      urlsList.push(trimmed);
    }
    $('#cloneUrlInput').value = '';
    renderUrls();
    updateSummary();
  }

  function removeUrl(index) {
    urlsList.splice(index, 1);
    renderUrls();
    updateSummary();
  }

  $('#cloneBtnAddUrl').onclick = () => addUrl($('#cloneUrlInput').value);
  $('#cloneUrlInput').onkeydown = e => { if (e.key === 'Enter') { e.preventDefault(); addUrl($('#cloneUrlInput').value); } };

  $('#cloneBtnAddBatch').onclick = () => {
    const raw = $('#cloneUrlsBatch').value;
    const lines = raw.split('\n').map(l => l.trim()).filter(Boolean);
    for (const l of lines) {
      if (/^https?:\/\//i.test(l) && !urlsList.includes(l)) urlsList.push(l);
    }
    $('#cloneUrlsBatch').value = '';
    renderUrls();
    updateSummary();
  };

  function renderUrls() {
    const list = $('#cloneUrlsList');
    const badge = $('#badgeUrlsCount');
    if (!urlsList.length) {
      list.innerHTML = '';
      badge.style.display = 'none';
      return;
    }
    badge.style.display = 'inline-block';
    badge.textContent = String(urlsList.length);

    list.innerHTML = urlsList.map((u, i) => `
      <div class="clone-file-item">
        <div style="display:flex;align-items:center;gap:8px;min-width:0">
          <span style="font-size:15px">🔗</span>
          <span class="clone-file-badge video">Link Vídeo</span>
          <span style="font-family:var(--mono);font-size:11.5px;color:var(--cream);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:320px" title="${esc(u)}">${esc(u)}</span>
        </div>
        <button type="button" class="clone-del-btn" data-url-idx="${i}" title="Remover link">&times;</button>
      </div>
    `).join('');

    list.querySelectorAll('.clone-del-btn').forEach(btn => {
      btn.onclick = () => removeUrl(Number(btn.dataset.urlIdx));
    });
  }

  // Gerenciamento de Skill
  $('#cloneSkillFileInput').onchange = async e => {
    const f = e.target.files[0];
    if (f) {
      $('#cloneSkill').value = await f.text();
      updateSummary();
    }
  };
  $('#cloneSkill').oninput = () => updateSummary();

  // Resumo de contagens e validações
  function updateSummary() {
    const vidsLocal = filesList.filter(f => isVideo(f.name)).length;
    const imgsLocal = filesList.filter(f => !isVideo(f.name)).length;
    const vidsUrls = urlsList.length;
    const totalVideos = vidsLocal + vidsUrls;
    const hasSkill = Boolean($('#cloneSkill').value.trim());

    $('#badgeSkillActive').style.display = hasSkill ? 'inline-block' : 'none';

    const pills = [];
    if (vidsLocal > 0) pills.push(`<span class="clone-summary-pill highlight">🎬 ${vidsLocal} ${vidsLocal === 1 ? 'vídeo local' : 'vídeos locais'}</span>`);
    if (imgsLocal > 0) pills.push(`<span class="clone-summary-pill highlight">🖼️ ${imgsLocal} ${imgsLocal === 1 ? 'imagem' : 'imagens'}</span>`);
    if (vidsUrls > 0) pills.push(`<span class="clone-summary-pill highlight">🔗 ${vidsUrls} ${vidsUrls === 1 ? 'link de vídeo' : 'links de vídeo'}</span>`);
    if (hasSkill) pills.push(`<span class="clone-summary-pill highlight">📄 Skill pronta</span>`);

    if (!pills.length) {
      pills.push(`<span class="clone-summary-pill">0 referências selecionadas</span>`);
    }

    $('#cloneSummaryPills').innerHTML = pills.join('');

    const hint = $('#cloneLimitHint');
    if (totalVideos > 5) {
      hint.innerHTML = `<span style="color:#ef4444;font-weight:700">⚠️ ${totalVideos}/5 vídeos (limite máximo excedido)</span>`;
    } else if (totalVideos > 0) {
      hint.innerHTML = `<span style="color:var(--cream)">${totalVideos}/5 vídeos de referência</span>`;
    } else {
      hint.textContent = 'Máx. 5 vídeos de referência';
    }
  }

  // Submit
  $('#cloneGo').onclick = async () => {
    const errBox = $('#cloneErrorBox');
    errBox.style.display = 'none';
    errBox.textContent = '';

    const id = sanitizeSlug($('#cloneId').value.trim());
    if (!id) {
      errBox.textContent = 'Por favor, digite o identificador do formato.';
      errBox.style.display = 'block';
      $('#cloneId').focus();
      return;
    }
    if (!/^[\w][\w.-]*$/.test(id)) {
      errBox.textContent = 'Nome do formato inválido. Use apenas letras minúsculas, números, hífens ou sublinhados.';
      errBox.style.display = 'block';
      $('#cloneId').focus();
      return;
    }

    const vidsLocal = filesList.filter(f => isVideo(f.name)).length;
    const imgsLocal = filesList.filter(f => !isVideo(f.name)).length;
    const totalVideos = vidsLocal + urlsList.length;
    const skillText = $('#cloneSkill').value.trim();

    if (!filesList.length && !urlsList.length && !skillText) {
      errBox.textContent = 'Selecione ao menos um vídeo, imagem, link ou cole uma skill de referência.';
      errBox.style.display = 'block';
      return;
    }

    if (totalVideos > 5) {
      errBox.textContent = `Você selecionou ${totalVideos} vídeos de referência (locais + links). O limite máximo suportado pelo Opus é de 5 vídeos.`;
      errBox.style.display = 'block';
      return;
    }

    // Alterna para visualização de carregamento
    $('#cloneFormBody').style.display = 'none';
    $('#cloneFormFoot').style.display = 'none';
    $('#cloneLoadingView').style.display = 'flex';
    $('#cloneClose').style.display = 'none';

    const loadTitle = $('#cloneLoadingTitle');
    const loadMsg = $('#cloneLoadingMsg');

    try {
      const paths = [];
      for (let i = 0; i < filesList.length; i++) {
        const f = filesList[i];
        loadTitle.textContent = `Enviando arquivos (${i + 1} de ${filesList.length})...`;
        loadMsg.textContent = `Upload de ${f.name} (${formatBytes(f.size)})...`;

        const r = await fetch(`/upload?kind=media&name=${encodeURIComponent(f.name)}`, { method: 'POST', body: f });
        if (!r.ok) throw new Error(await r.text());
        const data = await r.json();
        paths.push(data.path);
      }

      loadTitle.textContent = '✨ Claude Opus 5.5 analisando referências...';
      loadMsg.innerHTML = 'Extraindo frames de corte, ritmo e alinhamento sonoro (SFX)...<br><span style="font-size:11px;opacity:0.8">Esta análise profunda pode levar entre 30 e 90 segundos.</span>';

      await api('POST', '/formats/clone', {
        id,
        urls: urlsList,
        paths,
        note: $('#cloneNote').value.trim(),
        skill: skillText
      });

      // Sucesso
      loadTitle.innerHTML = '🎉 Formato clonado com sucesso!';
      loadMsg.textContent = `O estilo "${id}" agora está disponível na sua galeria de formatos.`;
      
      setTimeout(() => {
        close();
        location.hash = '#/formats';
        formats();
      }, 1000);

    } catch (e) {
      // Restaura form e exibe erro
      $('#cloneFormBody').style.display = 'flex';
      $('#cloneFormFoot').style.display = 'flex';
      $('#cloneLoadingView').style.display = 'none';
      $('#cloneClose').style.display = 'flex';
      errBox.textContent = `Erro ao clonar formato: ${e.message || e}`;
      errBox.style.display = 'block';
    }
  };
}

// Chaves de API (B-roll e vozes). O servidor só devolve a máscara; a chave inteira nunca volta para esta página.
async function configKeys() {
  const rows = await api("GET", "/settings/keys");
  const group = (kind, title) => `<h4 style="margin:18px 0 8px">${title}</h4>` + rows.filter(r => r.kind === kind).map(r => `
    <div class="fmt-prop-card" data-p="${esc(r.id)}" style="margin-bottom:10px">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap">
        <strong>${esc(r.name)}</strong>
        <span class="muted key-status" style="font-size:12px;font-family:var(--mono)">${r.needsKey ? (r.hasKey ? "salva " + esc(r.masked) : "sem chave") : "não precisa de chave"}</span>
      </div>
      ${r.needsKey ? `<div style="display:flex;gap:6px;margin-top:10px">
        <input type="password" class="key-in" placeholder="${r.hasKey ? "colar nova chave para trocar" : "colar a chave"}" autocomplete="off" style="flex:1;min-width:0">
        <button class="key-save">Salvar</button>
        ${r.hasKey ? `<button class="key-del">Remover</button>` : ""}
      </div>` : ""}
      <div style="margin-top:8px"><button class="key-test" ${r.needsKey && !r.hasKey ? "disabled" : ""}>Testar</button></div>
    </div>`).join("");
  app.innerHTML = `<div class="box" style="max-width:720px;margin:0 auto">
    <a href="#/config" class="muted" style="font-size:12px">← Dimensões e formatos</a>
    <h3 style="margin:8px 0 4px">Chaves de API</h3>
    <p class="muted" style="font-size:12px;line-height:1.5">Ficam em <span style="font-family:var(--mono)">${esc(rows[0]?.file || "")}</span>, fora dos projetos e do git. Só você, neste computador, lê esse arquivo.</p>
    ${group("broll", "B-roll")}
    ${group("voice", "Vozes sintetizadas")}
  </div>`;
  app.querySelectorAll("[data-p]").forEach(card => {
    const id = card.dataset.p, status = card.querySelector(".key-status");
    card.querySelector(".key-save")?.addEventListener("click", e => act(e.target, async () => {
      const input = card.querySelector(".key-in");
      await api("PUT", `/settings/keys/${id}`, { key: input.value });
      input.value = "";
      configKeys();
    }));
    card.querySelector(".key-del")?.addEventListener("click", e => act(e.target, async () => {
      if (!confirm("Remover esta chave?")) return;
      await api("DELETE", `/settings/keys/${id}`);
      configKeys();
    }));
    card.querySelector(".key-test").addEventListener("click", e => act(e.target, async () => {
      const r = await api("POST", `/settings/keys/${id}/test`);
      status.textContent = (r.ok ? "✓ " : "✗ ") + r.message;
      status.style.color = r.ok ? "var(--accent)" : "#ff6b6b";
    }));
  });
}

// Atualização do Editor: busca commits novos no GitHub e, se o usuário quiser, faz git pull + npm install e reinicia o servidor.
async function configUpdate() {
  app.innerHTML = `<div class="box" style="max-width:720px;margin:0 auto">
    <a href="#/config" class="muted" style="font-size:12px">← Dimensões e formatos</a>
    <h3 style="margin:8px 0 4px">Atualização do Editor</h3>
    <p class="muted" style="font-size:12px;line-height:1.5">Compara esta instalação com o GitHub. Baixar reinicia o servidor; projetos, marcas e chaves não são apagados.</p>
    <div style="display:flex;gap:6px;margin:12px 0"><button id="up-check">Buscar atualização</button><button id="up-apply" style="display:none">Baixar e reiniciar</button></div>
    <div id="up-out" class="muted" style="font-size:12px;line-height:1.6;font-family:var(--mono)"></div>
  </div>`;
  const out = $("#up-out"), applyBtn = $("#up-apply");
  $("#up-check").onclick = e => act(e.target, async () => {
    out.textContent = "Consultando o GitHub...";
    const r = await api("GET", "/update/check");
    applyBtn.style.display = r.behind ? "" : "none";
    out.innerHTML = r.behind
      ? `${r.behind} atualização(ões) disponível(is):<br>${r.commits.map(c => "• " + esc(c)).join("<br>")}${r.dirty ? "<br><br>⚠️ Há edições locais em arquivos do Editor; elas serão guardadas e reaplicadas." : ""}`
      : "✓ Já está na versão mais recente.";
  });
  applyBtn.onclick = e => act(e.target, async () => {
    out.textContent = "Baixando e instalando... não feche esta aba.";
    const r = await api("POST", "/update/apply");
    out.textContent = r.message;
    if (!r.updated) return;
    // o servidor morre e volta pelo start.sh; recarrega quando responder de novo
    await new Promise(ok => setTimeout(ok, 3000));
    const t = setInterval(() => fetch("/formats").then(x => { if (x.ok) { clearInterval(t); location.reload(); } }).catch(() => {}), 1500);
  });
}

// Som sutil de notificação via Web Audio API (sem dependências externas)
function playNotificationSound() {
  try {
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    if (!AudioContext) return;
    const ctx = new AudioContext();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(587.33, ctx.currentTime); // D5
    osc.frequency.exponentialRampToValueAtTime(880, ctx.currentTime + 0.14); // A5
    gain.gain.setValueAtTime(0.06, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.28);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start();
    osc.stop(ctx.currentTime + 0.28);
  } catch (e) {}
}

// Toasts de Notificação
function showToast({ title, message, type = 'info', projectId = null, duration = 6000 }) {
  const container = $('#toast-container');
  if (!container) return;
  const t = document.createElement('div');
  t.className = `toast-item ${type}`;
  const icon = type === 'success' ? '⚡' : (type === 'warning' ? '⚠️' : 'ℹ️');
  t.innerHTML = `
    <span class="toast-icon">${icon}</span>
    <div class="toast-body">
      <div class="toast-title">${esc(title)}</div>
      <div class="toast-msg">${esc(message)}</div>
      ${projectId ? `<button type="button" class="toast-btn" onclick="location.hash='#/p/${encodeURIComponent(projectId)}'">Abrir Projeto →</button>` : ''}
    </div>
    <button type="button" class="toast-close" title="Fechar">×</button>
  `;
  const closeBtn = t.querySelector('.toast-close');
  const dismiss = () => {
    t.classList.add('leaving');
    setTimeout(() => t.remove(), 220);
  };
  if (closeBtn) closeBtn.onclick = dismiss;
  container.appendChild(t);
  if (duration > 0) setTimeout(dismiss, duration);
}

// ---- Abas de Projetos Recentes no Topo -----------------------------------------------------------------
function loadRecentTabs() {
  try {
    const saved = localStorage.getItem('editor_recent_tabs');
    if (saved) openProjectTabs = JSON.parse(saved);
  } catch {}
  if (!Array.isArray(openProjectTabs)) openProjectTabs = [];
}

function saveRecentTabs() {
  try {
    localStorage.setItem('editor_recent_tabs', JSON.stringify(openProjectTabs));
  } catch {}
}

function addProjectTab(id) {
  if (!id) return;
  loadRecentTabs();
  openProjectTabs = openProjectTabs.filter(tid => tid !== id);
  openProjectTabs.unshift(id);
  if (openProjectTabs.length > 5) openProjectTabs = openProjectTabs.slice(0, 5);
  saveRecentTabs();
  renderHeaderTabs();
}

function removeProjectTab(id, e) {
  if (e) {
    e.stopPropagation();
    e.preventDefault();
  }
  loadRecentTabs();
  openProjectTabs = openProjectTabs.filter(tid => tid !== id);
  saveRecentTabs();
  renderHeaderTabs();
}

function renderHeaderTabs() {
  const el = $('#header-project-tabs');
  if (!el) return;
  loadRecentTabs();

  const tabsToRender = [...openProjectTabs];
  if (sidebarCurrentProjectId && !tabsToRender.includes(sidebarCurrentProjectId)) {
    tabsToRender.unshift(sidebarCurrentProjectId);
  }

  if (!tabsToRender.length) {
    el.innerHTML = '';
    return;
  }

  el.innerHTML = tabsToRender.map(id => {
    const p = (globalProjectsData || []).find(x => x.id === id);
    const name = p?.name || id;
    const isCur = id === sidebarCurrentProjectId;
    const isCompleted = !!p?.completed;
    const isRun = !!p?.running;
    const isAction = !isCompleted && !!p?.requiresHumanConfirmation;
    const isDone = isCompleted || !!p?.hasFinal;

    let dotCls = '';
    if (isRun) dotCls = 'running';
    else if (isAction) dotCls = 'action';
    else if (isDone) dotCls = 'done';

    return `
      <div class="proj-tab ${isCur ? 'active' : ''}" onclick="location.hash='#/p/${encodeURIComponent(id)}'" title="${esc(name)}">
        <span class="proj-tab-dot ${dotCls}"></span>
        <span class="proj-tab-name">${esc(name)}</span>
        <span class="proj-tab-close" onclick="removeProjectTab('${esc(id)}', event)" title="Fechar aba">×</span>
      </div>
    `;
  }).join('');
}

// ---- Quick Switcher / Command Palette (Cmd + K) -------------------------------------------------------
let cmdPaletteOpen = false;
let cmdPaletteSelectedIndex = 0;
let cmdPaletteFilteredItems = [];

function openCmdPalette() {
  const modal = $('#cmd-palette');
  const input = $('#cmd-palette-input');
  if (!modal || !input) return;
  cmdPaletteOpen = true;
  modal.style.display = 'flex';
  input.value = '';
  cmdPaletteSelectedIndex = 0;
  input.focus();
  renderCmdPalette();
}

function closeCmdPalette() {
  const modal = $('#cmd-palette');
  if (!modal) return;
  cmdPaletteOpen = false;
  modal.style.display = 'none';
}

function renderCmdPalette() {
  const input = $('#cmd-palette-input');
  const listEl = $('#cmd-palette-results');
  if (!listEl) return;
  const q = (input?.value || '').trim().toLowerCase();

  const actions = [
    { type: 'action', title: '➕ Criar Novo Vídeo', sub: 'Abrir formulário de criação de projeto', run: () => { dashCurrentTab = 'new'; location.hash = '#/'; } },
    { type: 'action', title: '📊 Ir para Esteira de Projetos', sub: 'Visão geral de todos os vídeos', run: () => { dashCurrentTab = 'esteira'; location.hash = '#/'; } },
    { type: 'action', title: '🏢 Ver Brandkits', sub: 'Gerenciar marcas, paletas e fontes', run: () => { location.hash = '#/brands'; } },
    { type: 'action', title: '📐 Ver Formatos', sub: 'Estilos visuais e proporções de tela', run: () => { location.hash = '#/formats'; } },
    { type: 'action', title: '⚙️ Configurações', sub: 'Parâmetros e integrações', run: () => { location.hash = '#/config'; } },
  ];

  const projects = (globalProjectsData || []).map(p => ({
    type: 'project',
    id: p.id,
    title: p.name || p.id,
    brand: p.brand || '',
    stepLabel: p.stepLabel || '',
    sub: `${p.brand ? '[' + p.brand + '] ' : ''}${p.stepLabel}${p.running ? ' (⚡ rodando)' : (p.requiresHumanConfirmation ? ' (⚠️ requer aprovação)' : '')}`,
    run: () => { location.hash = `#/p/${encodeURIComponent(p.id)}`; }
  }));

  let all = [...actions, ...projects];
  if (q) {
    all = all.filter(it => 
      it.title.toLowerCase().includes(q) || 
      (it.sub && it.sub.toLowerCase().includes(q)) || 
      (it.brand && it.brand.toLowerCase().includes(q))
    );
  }
  cmdPaletteFilteredItems = all;
  if (cmdPaletteSelectedIndex >= all.length) cmdPaletteSelectedIndex = Math.max(0, all.length - 1);

  if (!all.length) {
    listEl.innerHTML = `<div style="padding:24px;text-align:center;color:var(--mute);font-size:12.5px">Nenhum resultado para "${esc(q)}".</div>`;
    return;
  }

  listEl.innerHTML = all.map((it, idx) => {
    const isSel = idx === cmdPaletteSelectedIndex;
    return `
      <div class="cmd-palette-item ${isSel ? 'selected' : ''}" data-idx="${idx}" onclick="execCmdPaletteItem(${idx})">
        <div class="cmd-palette-item-left">
          <span style="font-size:16px">${it.type === 'action' ? '⚡' : '🎞️'}</span>
          <div>
            <div class="cmd-palette-item-title">${esc(it.title)}</div>
            <div class="cmd-palette-item-sub">${esc(it.sub)}</div>
          </div>
        </div>
        ${it.brand ? `<span class="cmd-palette-item-badge">${esc(it.brand)}</span>` : '<span style="font-size:12px;opacity:0.4">↵</span>'}
      </div>
    `;
  }).join('');

  const selEl = listEl.querySelector('.cmd-palette-item.selected');
  if (selEl) selEl.scrollIntoView({ block: 'nearest' });
}

function execCmdPaletteItem(idx) {
  const item = cmdPaletteFilteredItems[idx];
  if (item && item.run) {
    closeCmdPalette();
    item.run();
  }
}

// Atalhos de teclado para o Command Palette
window.addEventListener('keydown', (e) => {
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') {
    e.preventDefault();
    if (cmdPaletteOpen) closeCmdPalette();
    else openCmdPalette();
    return;
  }

  if (cmdPaletteOpen) {
    if (e.key === 'Escape') {
      e.preventDefault();
      closeCmdPalette();
    } else if (e.key === 'ArrowDown') {
      e.preventDefault();
      if (cmdPaletteFilteredItems.length > 0) {
        cmdPaletteSelectedIndex = (cmdPaletteSelectedIndex + 1) % cmdPaletteFilteredItems.length;
        renderCmdPalette();
      }
    } else if (e.key === 'ArrowUp') {
      e.preventDefault();
      if (cmdPaletteFilteredItems.length > 0) {
        cmdPaletteSelectedIndex = (cmdPaletteSelectedIndex - 1 + cmdPaletteFilteredItems.length) % cmdPaletteFilteredItems.length;
        renderCmdPalette();
      }
    } else if (e.key === 'Enter') {
      e.preventDefault();
      execCmdPaletteItem(cmdPaletteSelectedIndex);
    }
  }
});

  $('#cmd-palette-input')?.addEventListener('input', renderCmdPalette);
});

// ---- Menu Lateral de Outros Projetos (Categorizado & com Filtros) ---------------------------------------
function formatDuration(s) {
  if (s < 60) return `${s}s`;
  const m = Math.floor(s / 60);
  const remS = s % 60;
  if (m < 60) return `${m}m ${remS < 10 ? '0' : ''}${remS}s`;
  const h = Math.floor(m / 60);
  const remM = m % 60;
  return `${h}h ${remM < 10 ? '0' : ''}${remM}m`;
}

function renderSidebarProjects() {
  const sb = $('#projects-sidebar');
  const toggleBtn = $('#sidebar-toggle');
  const countBadge = $('#sidebar-count-badge');
  const alertDot = $('#sidebar-alert-dot');
  const totalBadge = $('#sidebar-total-badge');
  const statsEl = $('#sidebar-stats');
  const listEl = $('#sidebar-projects-list');
  const brandSelect = $('#sidebar-brand-select');
  if (!sb || !listEl || !sidebarCurrentProjectId) return;

  const allOthers = (globalProjectsData || []).filter(p => p.id !== sidebarCurrentProjectId);

  // Popula marcas no dropdown
  if (brandSelect) {
    const brands = [...new Set(allOthers.map(p => p.brand).filter(Boolean))];
    const curVal = brandSelect.value;
    brandSelect.innerHTML = `<option value="">Marcas</option>` + brands.map(b => `<option value="${esc(b)}" ${b === curVal ? 'selected' : ''}>${esc(b)}</option>`).join('');
  }

  // Estatísticas globais da sidebar
  const runningCount = allOthers.filter(p => p.running).length;
  const needConfirmCount = allOthers.filter(p => p.requiresHumanConfirmation && !p.completed).length;

  if (totalBadge) totalBadge.textContent = String(allOthers.length);
  if (countBadge) {
    countBadge.textContent = String(allOthers.length);
    countBadge.style.display = allOthers.length > 0 ? 'inline-flex' : 'none';
  }

  if (toggleBtn) toggleBtn.classList.toggle('has-alert', needConfirmCount > 0);
  if (alertDot) alertDot.style.display = needConfirmCount > 0 ? 'inline-block' : 'none';

  if (statsEl) {
    const parts = [];
    if (runningCount > 0) parts.push(`<span style="color:#00e676;font-weight:600">● ${runningCount} rodando</span>`);
    if (needConfirmCount > 0) parts.push(`<span style="color:var(--yellow);font-weight:600">⚠️ ${needConfirmCount} aguarda ação</span>`);
    if (!parts.length) parts.push(`<span>${allOthers.length} outro(s) projeto(s)</span>`);
    statsEl.innerHTML = parts.join(' · ');
  }

  // Aplica filtros locais
  let filtered = [...allOthers];
  if (sidebarActiveFilter === 'confirm') {
    filtered = filtered.filter(p => p.requiresHumanConfirmation && !p.completed);
  } else if (sidebarActiveFilter === 'running') {
    filtered = filtered.filter(p => p.running);
  } else if (sidebarActiveFilter === 'done') {
    filtered = filtered.filter(p => p.completed || p.hasFinal);
  }

  if (sidebarActiveBrand) {
    filtered = filtered.filter(p => p.brand === sidebarActiveBrand);
  }

  if (sidebarSearchQuery) {
    const q = sidebarSearchQuery.toLowerCase();
    filtered = filtered.filter(p => 
      (p.name && p.name.toLowerCase().includes(q)) || 
      (p.id && p.id.toLowerCase().includes(q)) || 
      (p.brand && p.brand.toLowerCase().includes(q)) || 
      (p.stepLabel && p.stepLabel.toLowerCase().includes(q))
    );
  }

  if (!filtered.length) {
    listEl.innerHTML = `
      <div class="side-empty-msg">
        <div style="font-size:24px;margin-bottom:8px;opacity:0.6">📁</div>
        <p style="margin:0 0 6px">Nenhum projeto encontrado.</p>
        <span class="muted" style="font-size:11px">Tente ajustar a busca ou os filtros da barra superior.</span>
      </div>`;
    return;
  }

  // Divisão em 3 grupos estruturados: Ação, Rodando e Outros
  const groupAction = filtered.filter(p => p.requiresHumanConfirmation && !p.completed);
  const groupRunning = filtered.filter(p => p.running);
  const groupNormal = filtered.filter(p => (!p.requiresHumanConfirmation || p.completed) && !p.running);

  const now = Date.now();
  const renderCard = (p) => {
    const isRun = !!p.running;
    const isCompleted = !!p.completed;
    const isNeedsConfirm = !isCompleted && !!p.requiresHumanConfirmation;
    const startTimestamp = isRun ? (p.running.startedAt || now) : (p.lastActivityAt || p.createdAt || now);
    const elapsedSec = Math.max(0, Math.floor((now - startTimestamp) / 1000));
    const elapsedFmt = formatDuration(elapsedSec);

    let stepBadge = '';
    if (isRun) {
      stepBadge = `<div class="side-card-step-row is-running"><span class="pulse-dot"></span> <span class="side-card-step-tag">⚡ ${esc(p.stepLabel)}</span></div>`;
    } else if (isCompleted) {
      stepBadge = `<div class="side-card-step-row is-done"><span style="color:#00e676">✓</span> <span class="side-card-step-tag" style="color:#00e676;font-weight:700">Concluído</span></div>`;
    } else if (p.hasFinal) {
      stepBadge = `<div class="side-card-step-row is-done"><span style="color:#00e676">✓</span> <span class="side-card-step-tag">Vídeo Pronto</span></div>`;
    } else {
      stepBadge = `<div class="side-card-step-row"><span style="color:var(--yellow)">◈</span> <span class="side-card-step-tag">${esc(p.stepLabel)}</span></div>`;
    }

    let timeLabel = '';
    if (isRun) {
      timeLabel = `⏱️ Rodando há <span class="side-time-val" data-started="${startTimestamp}">${elapsedFmt}</span>`;
    } else if (isNeedsConfirm) {
      timeLabel = `⏳ Aguardando há <span class="side-time-val" data-started="${startTimestamp}">${elapsedFmt}</span>`;
    } else {
      timeLabel = `Última etapa: há <span class="side-time-val" data-started="${startTimestamp}">${elapsedFmt}</span>`;
    }

    let actionBox = '';
    if (isNeedsConfirm) {
      actionBox = `
        <div class="side-card-human-action" title="Ação humana pendente neste projeto">
          <div style="display:flex;align-items:center;gap:6px">
            <span class="action-alert-icon">⚠️</span>
            <span>Confirmação: <b>${esc(p.humanConfirmationLabel)}</b></span>
          </div>
          <span style="font-size:12px;opacity:0.8">➔</span>
        </div>`;
    } else if (isRun) {
      actionBox = `
        <div class="side-card-running-pill">
          <span class="step-spinner" style="width:11px;height:11px;border-width:2px"></span>
          <span>IA / Render em execução...</span>
        </div>`;
    }

    const cardClasses = ['side-card'];
    if (isNeedsConfirm) cardClasses.push('needs-confirmation');
    if (isRun) cardClasses.push('is-running');

    return `
      <div class="${cardClasses.join(' ')}" data-pid="${esc(p.id)}" onclick="location.hash='#/p/${encodeURIComponent(p.id)}'">
        <div class="side-card-top">
          <span class="side-card-name">${esc(p.name || p.id)}</span>
          ${p.brand ? `<span class="side-card-brand">${esc(p.brand)}</span>` : ''}
        </div>
        ${stepBadge}
        <div class="side-card-time">${timeLabel}</div>
        ${actionBox}
      </div>
    `;
  };

  let html = '';
  if (groupAction.length > 0) {
    html += `<div class="sidebar-section-title action">⚠️ REQUER SUA AÇÃO (${groupAction.length})</div>`;
    html += groupAction.map(renderCard).join('');
  }
  if (groupRunning.length > 0) {
    html += `<div class="sidebar-section-title running">⚡ EM EXECUÇÃO (${groupRunning.length})</div>`;
    html += groupRunning.map(renderCard).join('');
  }
  if (groupNormal.length > 0) {
    if (groupAction.length > 0 || groupRunning.length > 0) {
      html += `<div class="sidebar-section-title normal">📁 DEMAIS PROJETOS (${groupNormal.length})</div>`;
    }
    html += groupNormal.map(renderCard).join('');
  }

  listEl.innerHTML = html;
}

function tickSidebarElapsed() {
  const now = Date.now();
  document.querySelectorAll('.side-time-val').forEach(el => {
    const started = Number(el.dataset.started || 0);
    if (!started) return;
    const s = Math.max(0, Math.floor((now - started) / 1000));
    el.textContent = formatDuration(s);
  });
}

function initProjectsSidebar(projectId) {
  sidebarCurrentProjectId = projectId;
  const sb = $('#projects-sidebar');
  const tog = $('#sidebar-toggle');
  const closeBtn = $('#sidebar-close-btn');

  if (sb) sb.style.display = 'flex';
  if (tog) {
    tog.style.display = 'inline-flex';
    tog.onclick = () => {
      const isCurrentlyOpen = document.body.classList.contains('has-sidebar') && !sb.classList.contains('collapsed');
      setSidebarOpen(!isCurrentlyOpen);
    };
  }
  if (closeBtn) {
    closeBtn.onclick = () => setSidebarOpen(false);
  }

  // Eventos de Busca e Filtros na Sidebar

    searchInp.oninput = (e) => {
      sidebarSearchQuery = e.target.value;
      if (searchClear) searchClear.style.display = sidebarSearchQuery ? 'inline-block' : 'none';
      renderSidebarProjects();
    };
  }
  if (searchClear) {
    searchClear.onclick = () => {
      if (searchInp) searchInp.value = '';
      sidebarSearchQuery = '';
      searchClear.style.display = 'none';
      renderSidebarProjects();
    };
  }

  document.querySelectorAll('.s-filter-btn').forEach(btn => {
    btn.onclick = () => {
      document.querySelectorAll('.s-filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      sidebarActiveFilter = btn.dataset.filter || 'all';
      renderSidebarProjects();
    };

  const bSelect = $('#sidebar-brand-select');
  if (bSelect) {
    bSelect.onchange = (e) => {
      sidebarActiveBrand = e.target.value;
      renderSidebarProjects();
    };
  }

  // Restaura preferência do usuário (padrão: aberto em telas >= 1200px)
  let userPref = null;
  try { userPref = localStorage.getItem('editor_sidebar_open'); } catch {}
  const shouldOpen = userPref !== null ? userPref === '1' : window.innerWidth >= 1200;
  setSidebarOpen(shouldOpen);

  renderSidebarProjects();
}

function destroyProjectsSidebar() {
  sidebarCurrentProjectId = null;
  const sb = $('#projects-sidebar');
  if (sb) sb.style.display = 'none';
  const tog = $('#sidebar-toggle');
  if (tog) tog.style.display = 'none';
  document.body.classList.remove('has-sidebar');
  document.body.classList.remove('sidebar-collapsed');
}

// ---- Polling Global de Projetos & Monitoramento da IA ---------------------------------------------------
async function pollGlobalProjects() {
  try {
    const list = await api('GET', '/projects/overview');
    const prevMap = lastKnownProjectStates;
    const nextMap = new Map();

    // Notificações sonoras e toasts na conclusão de tarefas
    if (prevMap.size > 0) {
      for (const p of list) {
        const prev = prevMap.get(p.id);
        if (prev) {
          // A IA ou o render terminou
          if (prev.running && !p.running) {
            playNotificationSound();
            showToast({
              title: '⚡ IA / Processamento Concluído!',
              message: `O vídeo "${p.name || p.id}" finalizou a etapa: ${prev.stepLabel || 'execução'}.`,
              type: 'success',
              projectId: p.id
            });
            if (currentProjectId === p.id) {
              if (window.setProjectRunning) window.setProjectRunning(null);
              if (window.renderProject) window.renderProject();
            }
          }
          // Nova ação humana pendente
          if (!prev.requiresHumanConfirmation && p.requiresHumanConfirmation) {
            playNotificationSound();
            showToast({
              title: '⚠️ Confirmação Necessária',
              message: `"${p.name || p.id}": ${p.humanConfirmationLabel || 'Aprovação pendente'}`,
              type: 'warning',
              projectId: p.id
            });
            if (currentProjectId === p.id) {
              if (window.renderProject) window.renderProject();
            }
          }
        }
      }
    }

    for (const p of list) {
      if (p.id === currentProjectId && !p.running) {
        if (typeof window.getProjectRunning === 'function' && window.getProjectRunning()) {
          if (window.setProjectRunning) window.setProjectRunning(null);
          if (window.renderProject) window.renderProject();
        }
      }
      nextMap.set(p.id, {
        running: p.running,
        requiresHumanConfirmation: p.requiresHumanConfirmation,
        step: p.step,
        stepLabel: p.stepLabel
      });
    }
    lastKnownProjectStates = nextMap;
    globalProjectsData = list;

    // Atualiza Abas, Sidebar e Esteira sem recarregar a tela
    renderHeaderTabs();
    if (sidebarCurrentProjectId) renderSidebarProjects();
    if (window.renderDashProjects) window.renderDashProjects();
  } catch (err) {
    console.error('Falha no polling global de projetos:', err);
  }
}

// Inicia polling global permanente
if (!globalPollInterval) {
  pollGlobalProjects();
  globalPollInterval = setInterval(pollGlobalProjects, 3500);
}
if (!sidebarTimerInterval) {
  sidebarTimerInterval = setInterval(tickSidebarElapsed, 1000);
}

// ---- Roteador SPA -------------------------------------------------------------------------------------
function route() {
  es?.close();
  clearTimer();
  const h = location.hash.slice(1) || "/";
  const m = h.match(/^\/p\/(.+)$/);
  const b = h.match(/^\/brands\/?(.*)$/);
  const f = h.match(/^\/formats\/?(.*)$/);
  const cfg = h.match(/^\/config\/?(.*)$/);

  // Atualiza destaque na top navbar
  $("#nav-projects")?.classList.toggle("active", !b && !f && !cfg && !m);
  $("#nav-brands")?.classList.toggle("active", !!b);
  $("#nav-formats")?.classList.toggle("active", !!f);
  $("#nav-config")?.classList.toggle("active", !!cfg);

  // Garante que o trigger do Cmd+K esteja ativo
  $('#cmd-k-trigger')?.addEventListener('click', openCmdPalette);

  if (m) {
    const curId = decodeURIComponent(m[1]);
    addProjectTab(curId);
    initProjectsSidebar(curId);
    renderHeaderTabs();
    project(curId).catch(e => app.innerHTML = `<p class="err">${esc(e.message)}</p>`);
  } else {
    currentProjectId = null;
    destroyProjectsSidebar();
    renderHeaderTabs();
    if (b) {
      brands(b[1] || undefined).catch(e => app.innerHTML = `<p class="err">${esc(e.message)}</p>`);
    } else if (f) {
      formats(f[1] || undefined).catch(e => app.innerHTML = `<p class="err">${esc(e.message)}</p>`);
    } else if (cfg) {
      configSettings(cfg[1] || undefined).catch(e => app.innerHTML = `<p class="err">${esc(e.message)}</p>`);
    } else {
      projects().catch(e => app.innerHTML = `<p class="err">${esc(e.message)}</p>`);
    }
  }
}

onhashchange = route;
api('GET', '/anim-presets').then(p => ANIMP = p).finally(route);   // the preview needs the presets before the first paint
</script>
